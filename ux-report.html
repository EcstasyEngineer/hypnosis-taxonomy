<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UX acceptance evidence · Writer’s reference</title>
<style>
:root{color-scheme:light dark;--bg:#f5f5f1;--panel:#fff;--ink:#202a31;--muted:#505e67;--line:#d7dcd9;--accent:#245f9e;--good:#236c4a;--warn:#93451f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}main{max-width:1080px;margin:auto;padding:32px 24px 64px}a{color:var(--accent)}h1{font:clamp(30px,4vw,48px)/1.15 Georgia,serif;letter-spacing:-.03em}h2{font-size:20px}.lead{max-width:76ch;color:var(--muted)}.scores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:28px 0}.score{min-width:0;padding:22px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}.score strong{display:block;font-size:42px;font-variant-numeric:tabular-nums}.score span{font-size:13px;color:var(--muted)}.note{padding:16px;border-left:3px solid var(--accent);background:var(--panel)}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;text-transform:uppercase;letter-spacing:.04em}td:first-child{min-width:160px;width:30%}.state{font-weight:650}.pass{color:var(--good)}.fail,.unmeasured{color:var(--warn)}.solution{color:var(--muted);margin:6px 0}details{margin:12px 0;border:1px solid var(--line);padding:14px;border-radius:8px}summary{cursor:pointer;font-weight:650}.metric{overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.stamp{font-size:12px;color:var(--muted)}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button{font:inherit;padding:10px 16px;cursor:pointer}code{overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.gates li{margin:8px 0}
@media(prefers-color-scheme:dark){:root{--bg:#14191c;--panel:#1c2429;--ink:#edf2f4;--muted:#b2c0c7;--line:#3c4951;--accent:#8dc6ff;--good:#8fd9ae;--warn:#f4bc8c}}@media(max-width:600px){main{padding:22px 16px}.scores{gap:8px}.score{padding:14px 10px}.score strong{font-size:clamp(16px,5vw,23px)}.score span{font-size:11px}table,tbody,tr,td{display:block}thead{position:absolute;clip:rect(0,0,0,0)}tr{border:1px solid var(--line);border-radius:10px;margin:14px 0;background:var(--panel);padding:8px}td{border:0;padding:8px}td:first-child{width:auto}td[data-label]:before{content:attr(data-label) ': ';font-weight:650}}
</style>
<main><a href="./#/table">← Writer’s reference</a><h1>What changed.<br>How we checked it.</h1><p class="lead">An engineering acceptance report for the writer-tool revamp. It connects observable gaps to fixes and repeatable checks. No visitor tracking is used.</p><div id="report" role="status">Loading acceptance evidence…</div></main>
<script>
'use strict';
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function state(x){return '<span class="state '+(x==='pass'?'pass':x==='fail'?'fail':'unmeasured')+'">'+esc(x)+'</span>';}
async function load(){
 const host=document.getElementById('report');
 try{
  const r=await fetch('ux-telemetry.json');if(!r.ok)throw Error('Report unavailable');const d=await r.json();
  host.removeAttribute('role');
  host.innerHTML='<p class="stamp">Measured '+esc(d.measured_at)+' · Rubric '+esc(d.rubric_version)+'</p><div class="scores"><div class="score"><strong>'+d.baseline_score+'/100</strong><span>Measured original interface</span></div><div class="score"><strong>'+d.final_score+'/100</strong><span>Measured release candidate</span></div><div class="score"><strong>'+d.target_score+'/100</strong><span>Acceptance target</span></div></div><p class="note">'+esc(d.interpretation)+'</p><h2>Additional revamp measurements</h2><p>The prior unpublished candidate already passed the broad functional checklist. These observations describe the additional changes in this revamp.</p>'+d.improvements.map(x=>'<details open><summary>'+esc(x.title)+'</summary><p><strong>Before:</strong> '+esc(x.before)+'</p><p><strong>After:</strong> '+esc(x.after)+'</p><p>'+esc(x.solution)+'</p></details>').join('')+'<h2>Published baseline → release verification</h2><table><thead><tr><th>Check</th><th>Baseline</th><th>Release result</th></tr></thead><tbody>'+d.checks.map(c=>'<tr><td><strong>'+esc(c.id)+' · '+esc(c.title)+'</strong><p class="solution">'+esc(c.solution)+'</p><small>'+c.points+' points · '+esc(c.threshold)+'</small></td><td data-label="Baseline">'+state(c.baseline.status)+'<div class="metric">'+esc(c.baseline.observation)+'</div></td><td data-label="Release">'+state(c.final.status)+'<div class="metric">'+esc(c.final.observation)+'</div></td></tr>').join('')+'</tbody></table><h2>Mandatory release gates</h2><ul class="gates">'+d.gates.map(g=>'<li>'+state(g.status)+' · '+esc(g.title)+' — '+esc(g.observation)+'</li>').join('')+'</ul><h2>Measurement limits</h2><ul>'+d.limits.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><details><summary>Runtime and reproducibility</summary><p>'+esc(d.runtime)+'</p><p>Frozen rubric SHA-256: <code>'+esc(d.rubric_sha256)+'</code></p><pre>'+esc(JSON.stringify(d.artifact_sha256,null,2))+'</pre></details><p><a href="ux-telemetry.json">Download the structured measurements</a></p>';
 }catch(e){host.innerHTML='<p>The acceptance report could not be loaded.</p><button id="retryReport">Try again</button>';document.getElementById('retryReport').onclick=load;}
}load();
</script></html>
