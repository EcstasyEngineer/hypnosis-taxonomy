<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hypnosis Taxonomy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='5' cy='8' r='2.6' fill='%232361ae'/%3E%3Ccircle cx='11.5' cy='4.5' r='1.9' fill='%23888'/%3E%3Ccircle cx='11.5' cy='11.5' r='1.9' fill='%23888'/%3E%3Cpath d='M6.8 7.2 10 5.1M6.8 8.8 10 10.9' stroke='%23888' stroke-width='1.1'/%3E%3C/svg%3E">
<link rel="stylesheet" href="writer-tools.css">
<style>
  :root {
    color-scheme: light;
    --surface-0:#f6f6f4; --surface-1:#fdfdfc; --surface-2:#efefeb;
    --line:#e2e2dd; --line-2:#d2d2cb;
    --ink-1:#101010; --ink-2:#4e4d4a; --ink-3:#83827c; --ink-4:#aaa9a1;
    --accent:#2361ae; --accent-soft:rgba(35,97,174,.09);
    --warn:#a05a1f; --high:#a03a2e; --low:#4f6b2a;
    --g-est:#14684f; --g-sup:#1e8a68;
    --shadow:0 6px 24px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-0:#121211; --surface-1:#1a1a19; --surface-2:#242423;
      --line:#2f2f2c; --line-2:#403f3a;
      --ink-1:#f4f4f1; --ink-2:#b8b7ae; --ink-3:#83827a; --ink-4:#5e5d57;
      --accent:#5b93d8; --accent-soft:rgba(91,147,216,.13);
      --warn:#c98a4b; --high:#c9685a; --low:#9fbf72;
      --g-est:#5fd0a8; --g-sup:#58b896;
      --shadow:0 6px 24px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0:#121211; --surface-1:#1a1a19; --surface-2:#242423;
    --line:#2f2f2c; --line-2:#403f3a;
    --ink-1:#f4f4f1; --ink-2:#b8b7ae; --ink-3:#83827a; --ink-4:#5e5d57;
    --accent:#5b93d8; --accent-soft:rgba(91,147,216,.13);
    --warn:#c98a4b; --high:#c9685a; --low:#9fbf72;
    --g-est:#5fd0a8; --g-sup:#58b896;
    --shadow:0 6px 24px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  html{overflow-x:clip}
  body{
    background:var(--surface-0); color:var(--ink-1);
    font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:clip; overflow-wrap:break-word;
  }
  a{color:inherit}
  .serif{font-family:Charter,Georgia,"Times New Roman",serif}

  header{
    max-width:1200px;margin:0 auto;padding:22px 24px 0;
    display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;
  }
  h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em}
  h1 a{text-decoration:none}
  h1 a:hover{color:var(--accent)}
  .sub{color:var(--ink-3);font-size:13px;margin:0;font-variant-numeric:tabular-nums}
  .hgrow{flex:1 1 auto}
  .hbtn{
    border:1px solid var(--line-2);background:var(--surface-1);color:var(--ink-2);
    border-radius:6px;padding:5px 12px;font:inherit;font-size:12.5px;cursor:pointer;
    text-decoration:none;
  }
  .hbtn:hover{color:var(--ink-1);border-color:var(--ink-4)}
  .hbtn.on{border-color:var(--accent);color:var(--accent)}

  main{max-width:1200px;margin:0 auto;padding:16px 24px 72px}

  .crumbs{font-size:13px;color:var(--ink-3);margin:4px 0 16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .crumbs a{text-decoration:none}
  .crumbs a:hover{color:var(--accent)}
  .crumbs .sep{color:var(--ink-4)}
  .crumbs .here{color:var(--ink-2)}

  .searchwrap{margin:10px 0 20px;max-width:640px}
  input[type=search]{
    width:100%;border:1px solid var(--line-2);background:var(--surface-1);color:var(--ink-1);
    border-radius:8px;padding:10px 14px;font:inherit;font-size:14.5px;
  }
  input[type=search]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .hint{color:var(--ink-4);font-size:12px;margin:7px 2px 0}
  kbd{
    font:11px ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line-2);
    border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--surface-1);color:var(--ink-3);
  }

  .secthead{display:flex;align-items:baseline;gap:12px;margin:26px 0 10px}
  .secthead h2{margin:0;font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
  .secthead .n{color:var(--ink-4);font-size:12.5px;font-variant-numeric:tabular-nums}

  /* home: goal / stage tiles and the recipe shelf */
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .tile{display:flex;flex-direction:column;gap:5px;padding:13px 15px;border:1px solid var(--line);border-radius:10px;
        background:var(--surface-1);text-decoration:none}
  .tile:hover{border-color:var(--accent);background:var(--accent-soft)}
  .tile:focus-visible,.rcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tname{font-weight:650;font-size:15px}
  .tnum{display:inline-block;min-width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
        font-size:11.5px;text-align:center;line-height:20px;margin-right:8px;font-variant-numeric:tabular-nums}
  .tdef{color:var(--ink-2);font-size:13px;line-height:1.45}
  .tcnt{color:var(--ink-3);font-size:12px;margin-top:auto;font-variant-numeric:tabular-nums}
  .rshelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
  .rcard{display:flex;flex-direction:column;gap:5px;padding:13px 15px;border-left:3px solid var(--accent);
         background:var(--surface-1);border-radius:0 10px 10px 0;text-decoration:none}
  .rcard:hover{background:var(--accent-soft)}
  .rname{font-weight:650}
  .rone{color:var(--ink-2);font-size:13px;line-height:1.45}
  .rcnt{color:var(--ink-3);font-size:12px}
  .kind-badge{display:inline-block;font-size:10.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;
              border-radius:4px;padding:1px 6px;vertical-align:1px;border:1px solid currentColor;color:var(--ink-3)}
  .kind-badge.k-recipe{color:var(--accent)}
  .kindline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px}
  .tagchip{font-size:12px;color:var(--ink-2);text-decoration:none;border-radius:999px;padding:1px 9px;background:var(--surface-2)}
  .tagchip:hover{color:var(--accent)}
  .tagchip.t-stage::before{content:"◷ ";color:var(--ink-3)}
  .entry .lead{font-size:18px;line-height:1.5;margin:0 0 6px;color:var(--ink-1);max-width:62ch}
  ol.steps{margin:0;padding-left:22px}
  ol.steps li{margin:0 0 10px;padding-left:4px}
  ol.steps li p{margin:0;font-size:15.5px;line-height:1.55}
  .steplever{display:inline-block;margin-top:3px;font-size:13px;color:var(--accent);text-decoration:none}
  .steplever span{color:var(--ink-3)}
  .grade{margin:10px 0 0;font-size:13.5px;color:var(--ink-2)}
  .grade-badge{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;
               padding:1px 7px;margin-right:6px;border:1px solid currentColor}
  /* Established is the only FILLED badge, so the top two levels never look alike. */
  .g-established{color:var(--surface-1);background:var(--g-est);border-color:var(--g-est)}
  .g-supported{color:var(--g-sup)}.g-plausible{color:var(--accent)}.g-speculative{color:var(--warn)}.g-folk{color:var(--high)}
  .finding{margin:6px 0 0;font-size:13.5px;color:var(--ink-2)}
  .finding a{color:var(--accent)}
  .gradescale{margin:6px 0 0;padding-left:0;list-style:none;font-size:13px;color:var(--ink-2)}
  .gradescale li{margin:0 0 6px}
  .prereq{margin:0 0 16px;padding:10px 14px;border-left:3px solid var(--warn);background:var(--surface-1);border-radius:0 8px 8px 0;font-size:14px;color:var(--ink-2)}
  .prereq b{color:var(--ink-1)}
  .risklegend{font-size:12.5px;color:var(--ink-3);margin:-4px 0 12px;max-width:80ch}
  .risklegend b{font-weight:650}
  .starthere{display:inline-block;margin-left:8px;font-size:10.5px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:1px 6px;vertical-align:1px;background:var(--accent);color:#fff}
  details.deep{margin-top:10px}
  details.deep summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent);min-height:32px;padding:6px 0}
  details.deep p{margin-top:4px}
  .body.small,p.small{font-size:14px}
  ul.usedin,ul.risklist{margin:0;padding:0;list-style:none}
  ul.usedin li,ul.risklist li{margin:0 0 8px;font-size:14px;color:var(--ink-2)}
  ul.usedin a{font-weight:600;color:var(--ink-1)}
  ul.risklist .badge{margin:0 6px 0 0}
  .sublab{font-size:12px;color:var(--ink-3);margin:6px 0}
  .relation-item a{font-weight:600}
  .relation-one{color:var(--ink-2);font-size:13px}
  .chips .chiplab{margin:0 6px 0 0;align-self:center}
  .chips+.chips{margin-top:8px}
  .pagehead .eyebrow{margin:0 0 4px}

  .rows{display:flex;flex-direction:column}
  .mrow{
    display:block;padding:11px 10px;border-bottom:1px solid var(--line);
    text-decoration:none;border-radius:6px;
  }
  .mrow:hover{background:var(--accent-soft)}
  .mrow:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .mname{font-weight:600;font-size:14.5px}
  .mmech{
    color:var(--ink-2);font-size:13px;margin:3px 0 0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .gtag{
    display:inline-block;margin-left:8px;color:var(--ink-3);font-size:11.5px;
    border:1px solid var(--line-2);border-radius:4px;padding:0 6px;vertical-align:1px;
  }
  .badge{
    display:inline-block;margin-left:8px;font-size:10.5px;font-weight:650;letter-spacing:.05em;
    text-transform:uppercase;border-radius:4px;padding:1px 6px;vertical-align:1px;
    border:1px solid var(--line-2);color:var(--ink-3);
  }
  .badge.risk-low{color:var(--low);border-color:var(--low)}
  .badge.risk-medium{color:var(--warn);border-color:var(--warn)}
  .badge.risk-high{color:var(--high);border-color:var(--high)}
  .att{color:var(--ink-4);font-size:12px;margin-left:8px;font-variant-numeric:tabular-nums}

  .pagehead{margin:2px 0 6px}
  .pagehead h2{margin:0 0 4px;font-size:24px;letter-spacing:-.01em}
  .pagehead .gloss{color:var(--ink-2);font-size:14.5px;margin:0;max-width:70ch}
  .pagehead .gloss.small{font-size:13px;margin-top:6px;color:var(--ink-3)}
  .pagehead .count{color:var(--ink-4);font-size:12.5px;margin:6px 0 0;font-variant-numeric:tabular-nums}

  /* entry page */
  article.entry{max-width:760px}
  .entry h2{margin:0 0 6px;font-size:26px;letter-spacing:-.012em}
  .entry .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--ink-3);font-size:13px;margin:0 0 18px}
  .entry .meta .fam{font-variant:all-small-caps;letter-spacing:.04em}
  .sect{margin:0 0 20px}
  .sect .lab{font-size:11px;font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px}
  .sect p.body{margin:0;font-size:15.5px;line-height:1.62;color:var(--ink-1)}
  .sect p.body+p.body{margin-top:8px}
  .ex blockquote{
    margin:0;padding:12px 16px;border-left:3px solid var(--line-2);background:var(--surface-1);
    border-radius:0 8px 8px 0;font-size:14.5px;color:var(--ink-2);
  }
  .ex .facet{color:var(--ink-3);font-size:12px;margin:0 0 6px}
  .ex .move{margin:8px 0 0;font-size:13.5px;color:var(--ink-2)}
  .ex .move b{font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);margin-right:6px}
  details.confuse{border:1px solid var(--line);border-radius:8px;background:var(--surface-1)}
  details.confuse summary{
    cursor:pointer;padding:10px 14px;font-size:13.5px;font-weight:600;list-style:none;display:flex;gap:8px;align-items:baseline;
  }
  details.confuse summary::-webkit-details-marker{display:none}
  details.confuse summary::before{content:"▸";color:var(--ink-3);font-size:11px;transition:transform .12s}
  details.confuse[open] summary::before{transform:rotate(90deg)}
  details.confuse summary .n{color:var(--ink-4);font-weight:400;font-size:12.5px}
  .cue{padding:2px 16px 12px;font-size:13.5px;color:var(--ink-2)}
  .cue p{margin:4px 0 0}
  .cue .vs{margin:0}
  .cue .vs a{font-weight:600;text-decoration:none}
  .cue .vs a:hover{color:var(--accent)}
  .cue .vs .vslab{color:var(--ink-3);font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;margin-right:7px}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{
    border:1px solid var(--line-2);background:var(--surface-1);color:var(--ink-2);
    border-radius:6px;padding:4px 11px;font-size:12.5px;text-decoration:none;cursor:pointer;
  }
  .chip:hover{color:var(--accent);border-color:var(--accent)}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .chip .st{color:var(--ink-4);font-size:11px;margin-left:5px;font-variant-numeric:tabular-nums}
  .chip.mut{opacity:.55}
  .seqnote{color:var(--ink-4);font-size:12px;margin:6px 2px 0}

  /* graph view */
  .gresults{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}.gresults button{padding:8px 12px;text-align:left}
  .gresults[hidden]{display:none}.gresults p{width:100%;margin:0;color:var(--ink-2)}
  .gtools button,.gtools select,.gtools input,.gpanel .gopen,.gpanel .grow2{min-height:40px}
  .gpanel :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .gpanel h3:focus{outline:2px solid var(--accent);outline-offset:3px}

  .gworkspace{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
  .gworkspace .gpanel{position:static;width:300px;box-sizing:border-box;max-height:calc(100vh - 220px);box-shadow:none}
  .gworkspace .gpanel[hidden]{display:none}
  .gworkspace .gwrap{min-width:0}
  .gworkspace .grow2{border:0;background:none;color:inherit;font:inherit;text-align:left;width:100%;padding:6px 2px}
  .greason{font-size:12px;color:var(--ink-3);margin:0 0 6px}.greason summary{cursor:pointer}.greason p{margin:5px 0}
  .gworkspace .grow2 .gname{white-space:normal}
  #gmatch{font:inherit;padding:4px;background:var(--surface-1);color:var(--ink-1)}
  @media(max-width:900px){.gworkspace{grid-template-columns:minmax(0,1fr)}.gworkspace .gpanel{width:100%;max-height:400px}.gworkspace .gwrap{height:55vh;min-height:300px}}

  .gtools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
  .gmode{border:1px solid var(--line-2);background:var(--surface-1);color:var(--ink-2);
         border-radius:6px;padding:5px 13px;font:inherit;font-size:12.5px;cursor:pointer}
  .gmode.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .gmode:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #gsearch{width:220px;border-radius:6px;padding:5px 12px;font-size:12.5px;border:1px solid var(--line-2);
           background:var(--surface-1);color:var(--ink-1)}
  #gsearch:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .ghint{color:var(--ink-4);font-size:12px;margin-left:auto}
  .gwrap{position:relative;border:1px solid var(--line);border-radius:10px;background:var(--surface-1);
         overflow:hidden;height:calc(100vh - 220px);min-height:430px}
  #gcanvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  #gcanvas.dragging{cursor:grabbing}
  .gpanel{position:absolute;top:10px;right:10px;width:300px;max-height:calc(100% - 20px);
          overflow:auto;background:var(--surface-1);border:1px solid var(--line-2);border-radius:10px;
          box-shadow:var(--shadow);padding:14px 16px;font-size:13px}
  .gpanel h3{margin:0 0 2px;font-size:15px;line-height:1.25}
  .gpanel .gdoor{color:var(--ink-3);font-size:12px;margin:0 0 8px}
  .gpanel .gmech{color:var(--ink-2);margin:0 0 4px;display:-webkit-box;-webkit-line-clamp:5;
                 -webkit-box-orient:vertical;overflow:hidden}
  .gpanel .lab{font-size:10.5px;font-weight:650;letter-spacing:.07em;text-transform:uppercase;
               color:var(--ink-3);margin:12px 0 5px}
  .grow2{display:flex;align-items:baseline;gap:7px;padding:3px 2px;cursor:pointer;border-radius:5px}
  .grow2:hover .gname{color:var(--accent)}
  .grow2 .gname{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .grow2 .gstat{color:var(--ink-3);font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .grow2.mut{opacity:.5}
  .gopen{display:inline-block;margin-top:10px;border:1px solid var(--line-2);border-radius:6px;
         padding:4px 12px;font-size:12px;text-decoration:none;color:var(--ink-2)}
  .gopen:hover{color:var(--accent);border-color:var(--accent)}
  .glegend{display:flex;flex-wrap:wrap;gap:5px 14px;color:var(--ink-3);font-size:12px;margin:9px 2px 0}
  .glegend .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}

  .loading,.fatal{padding:60px 0;color:var(--ink-3);font-size:14px;max-width:640px}
  .fatal b{color:var(--ink-1)}
  .fatal code{
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;
    background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;
  }
  .empty{color:var(--ink-4);font-size:13.5px;padding:14px 4px}

  @media (max-width:640px){
    header{padding:16px 16px 0}
    main{padding:10px 16px 56px}
    .tiles,.rshelf{grid-template-columns:1fr}
    .entry .lead{font-size:16.5px}
    .gpanel{width:min(280px,80%)}
    .entry h2{font-size:21px}
  }
</style>

<header>
  <h1><a href="#/">Hypnosis Taxonomy</a></h1>

  <div class="hgrow"></div>
  <nav aria-label="Primary" style="display:flex;flex-wrap:wrap;gap:8px">
  <a class="hbtn" href="#/recipes">Recipes</a>

</header>

<p id="connectionStatus" role="status" hidden style="max-width:1152px;margin:12px auto;padding:0 16px"></p>

<script>
'use strict';

/* ============ theme ============ */
(function(){
  var KEY='of-theme', root=document.documentElement;
  try{ var saved=localStorage.getItem(KEY); if(saved==='light'||saved==='dark') root.setAttribute('data-theme',saved); }catch(e){}
  document.getElementById('themeToggle').addEventListener('click',function(){
    var cur=root.getAttribute('data-theme');
    if(!cur) cur=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
    var next=(cur==='dark')?'light':'dark';
    root.setAttribute('data-theme',next);
    try{ localStorage.setItem(KEY,next); }catch(e){}
  });
})();

/* ============ state ============ */
var S={ ready:false, byId:{}, byName:{}, nodes:[], goals:[], stages:[], tagById:{}, seeAlso:{}, contrasts:{}, usedIn:{},
        next:{}, prev:{}, cooc:{}, annScripts:0 };
var searchQuery='', memberFilter='', riskFilter='', crossFilter='';
var routeContext={}, currentRoute=null, timelineRows=null, timelineName='', timelineRead=0;
if('scrollRestoration' in history) history.scrollRestoration='manual';
// Remember the rendered route while the URL changes, including scroll during Back.
window.addEventListener('scroll',function(){
  if(currentRoute!==null){
    var ctx=routeContext[currentRoute]||(routeContext[currentRoute]={});
    ctx.scroll=window.scrollY;

var SITE='Hypnosis Taxonomy';
var KIND_LABEL={technique:'Lever',recipe:'Recipe',container:'Session structure',principle:'Principle'};
/* ONE axis: every grade rates the research behind the EXPLANATION (the effect the
   "why" relies on), never the move as used in a session. A move graded Established
   leans on a well-replicated effect; nobody has tested it inside hypnosis unless
   the text says so. */
var GRADE={
  established:['Established','The effect this explanation relies on is well replicated in research.'],
  supported:['Supported','The effect this explanation relies on has some direct research behind it.'],
  plausible:['Plausible','The explanation fits known psychology, but no study tests the effect it relies on.'],
  speculative:['Speculative','A reasonable guess with little evidence either way.'],
  folk:['Folk','Practitioner lore; nobody has tested the explanation.']
};
var GRADE_ORDER=['established','supported','plausible','speculative','folk'];
var GRADE_SCOPE='Grades rate the research behind the explanation, usually done outside hypnosis. They do not mean the move itself was tested in a hypnosis session.';
function gradeScale(){
  return '<details class="deep"><summary>How we grade</summary><p class="body small">'+esc(GRADE_SCOPE)+'</p><ol class="gradescale">'+
    GRADE_ORDER.map(function(k){return '<li><span class="grade-badge g-'+k+'">'+GRADE[k][0]+'</span> '+esc(GRADE[k][1])+'</li>';}).join('')+'</ol></details>';
}
var RISK={
  low:'Low risk: an ordinary move that is limited to the session and easy to undo.',
  lowBounded:'Low risk, if bounded: limited and easy to undo once its limits and off-switch are set as below. Without them, treat it as medium.',
  medium:'Medium risk: it can leave a stronger or longer-lasting effect. Check in afterwards and clear anything not wanted.',
  high:'High risk: aims at deep or lasting change, or at the listener’s ability to say no. Use only with informed agreement and a clear way out.'
};
var CONSENT_TEXT='Explicit consent: agree on this specific effect beforehand. General consent to hypnosis does not cover it.';
var BOUND_TEXT='Bounding required: set its limits when you install it, such as scope, duration, and a way to switch it off.';

function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
/* Slugs lose their hyphens for display, except in real compound words
   ("one-way", "self-voiced", "foot-in-the-door"). */
var COMPOUND_PREFIX=/(^|-)(self|non|pre|post|co|anti|semi|quasi|counter|re)-(?=[a-z])/g;
var COMPOUND_WORDS=['one-way','two-way','count-up','count-down','follow-up','foot-in-the-door','door-in-the-face','step-by-step','so-called','eye-roll','real-time'];
function titleCase(kebab){
  var t=String(kebab||'').replace(COMPOUND_PREFIX,'$1$2\u0000');
  COMPOUND_WORDS.forEach(function(w){ t=t.split(w).join(w.replace(/-/g,'\u0000')); });
  t=t.replace(/-/g,' ').replace(/\u0000/g,'-');
  return t.charAt(0).toUpperCase()+t.slice(1);
}
/* Prose with entry slugs ("false-bottom-depth-reframe (#329)", bare "yes-set" or "(#85)")
   turned into links. Only names that are real entries link; other hyphenated words stay text. */
function prose(text){
  return esc(text).replace(/\b([a-z0-9]+(?:-[a-z0-9]+)+)(\s*\(#(\d+)\))?|\(#(\d+)\)/g,function(m,slug,idPart,id1,id2){
    var n=(id1&&S.byId[+id1])||(slug&&S.byName[slug])||(id2&&S.byId[+id2]);
    return n?'<a href="#/entry/'+n.id+'">'+esc(n._title)+'</a>':m;
  });
}
function kindBadge(n){ return '<span class="kind-badge k-'+esc(n.kind)+'">'+esc(KIND_LABEL[n.kind]||n.kind)+'</span>'; }
/* Every list row says its risk, so a missing badge never reads as "unknown". */
function riskBadge(n){
  if(!n.risk) return '';
  var label=n.risk==='low'&&(n.consent||n.bounded)?'low risk, if bounded':n.risk+' risk';
  return ' <span class="badge risk-'+esc(n.risk)+'">'+esc(label)+'</span>';
}
var RISK_RANK={low:0,medium:1,high:2};
function riskRank(n){ return n.risk in RISK_RANK?RISK_RANK[n.risk]+((n.risk==='low'&&(n.consent||n.bounded))?0.5:0):1.5; }
var RISK_LEGEND='<p class="risklegend"><b>Low</b>: limited to the session and easy to undo. <b>Medium</b>: can leave a stronger or longer-lasting effect; check in afterwards. <b>High</b>: aims at deep or lasting change, or at the ability to say no; only with informed agreement and a way out. Lists show low risk first.</p>';
var LEVER_GLOSS='A <b>lever</b> is one single move. A <b>recipe</b> chains several levers into a named routine.';
function tagHref(t){ return '#/'+t.kind+'/'+t.slug; }
function plural(n,one,many){ return n+' '+(n===1?one:many); }
function matchCount(n){ return n===1?'1 entry matches.':n+' entries match.'; }
/* "× chance" only when at least 3 scripts share the pair; big lifts are whole numbers. */
function liftText(count,lift){
  if(count<3||!(lift>=1.05)) return '';
  return ' · '+(lift>=10?Math.round(lift):lift.toFixed(1))+'× chance';
}

/* ============ data load ============ */
function connectionStatus(){
  var status=document.getElementById('connectionStatus');
  status.hidden=navigator.onLine;
  status.textContent=S.ready?'You are offline. Loaded entries and your workspace remain available in this tab. Reloading needs a connection.':'You are offline. Reconnect, then retry loading the reference.';
}
window.addEventListener('online',connectionStatus);
window.addEventListener('offline',connectionStatus);
function loadData(){
  S.ready=false; graphTeardown();
  var view=document.getElementById('view');
  view.setAttribute('aria-busy','true');
  view.innerHTML='<div class="loading" role="status">Loading the reference…</div>';
  connectionStatus();
  function ingest(d){
    validateData(d);
    build(d); view.setAttribute('aria-busy','false'); connectionStatus(); route();
  }
  function fail(error){
    view.setAttribute('aria-busy','false');
    view.innerHTML='<section class="fatal" role="alert"><h2>Reference could not load</h2><p>'+
      (location.protocol==='file:'?'Open this reference through a web server to load its data.':'Check your connection and try again. Your saved workspace stays in this browser.')+
      '</p>'+(error&&error.referenceData?'<p>'+esc(error.message)+'</p>':'')+'<button type="button" id="retryLoad" class="hbtn">Retry loading</button></section>';
    document.getElementById('retryLoad').onclick=loadData;
  }
  if(window.fetch){
    fetch('graph.json',{cache:'no-cache'}).then(function(r){
      if(!r.ok) throw new Error(r.status); return r.json();
    }).then(ingest).catch(fail);
  } else xhrLoad(ingest,fail);
}
function xhrLoad(ok,bad){
  try{
    var x=new XMLHttpRequest();
    x.open('GET','graph.json');
    x.onload=function(){ try{ if(x.status<200||x.status>=300) throw new Error(x.status); ok(JSON.parse(x.responseText)); }catch(e){ bad(); } };
    x.onerror=bad;
    x.send();
  }catch(e){ bad(); }
}

function validateData(d){
  function require(ok){if(!ok){var error=new Error('This reference file is incomplete or incompatible with this viewer. Retry to fetch the current edition.');error.referenceData=true;throw error;}}
  function object(x){return x&&typeof x==='object'&&!Array.isArray(x);}
  function str(x){return x==null||typeof x==='string';}
  require(object(d)&&object(d.meta)&&d.meta.schema_version===3&&Array.isArray(d.nodes)&&d.nodes.length>0);
  require(Array.isArray(d.edges)&&Array.isArray(d.goals)&&Array.isArray(d.stages));
  require(object(d.meta.annotation_coverage)&&Number.isInteger(d.meta.annotation_coverage.annotated_units)&&d.meta.annotation_coverage.annotated_units>=0);
  var tags=new Set();
  d.goals.concat(d.stages).forEach(function(t){require(object(t)&&Number.isInteger(t.id)&&typeof t.name==='string'&&typeof t.label==='string'&&str(t.definition));tags.add(t.id);});
  var ids=new Set();
  d.nodes.forEach(function(n){
    require(object(n)&&Number.isInteger(n.id)&&n.id>0&&!ids.has(n.id)&&typeof n.name==='string'&&n.name.length>0&&typeof n.mech==='string');
    require(['technique','recipe','container','principle'].includes(n.kind)&&['scriptwriting_move','structural_pattern','supporting_principle','supporting_assessment'].includes(n.writer_role));
    require(['one_liner','why_short','principle_note','finding_name','finding_url'].every(function(k){return str(n[k]);})&&(n.evidence_grade==null||!!GRADE[n.evidence_grade]));
    require(n.finding_url==null||/^https:\/\//.test(n.finding_url));
    require(Array.isArray(n.goals)&&Array.isArray(n.stages)&&n.goals.concat(n.stages).every(function(t){return tags.has(t);}));
    require(Number.isInteger(n.annotation_units)&&n.annotation_units>=0&&Number.isFinite(n.x)&&Number.isFinite(n.y));
    if(n.steps!=null){require(Array.isArray(n.steps));n.steps.forEach(function(s){require(Array.isArray(s)&&s.length===2&&(s[0]===null||Number.isInteger(s[0]))&&typeof s[1]==='string');});}
    if(n.ex!=null){require(Array.isArray(n.ex));n.ex.forEach(function(ex){require(object(ex)&&['f','t','s','m'].every(function(k){return str(ex[k]);}));});}
    ids.add(n.id);
  });
  d.nodes.forEach(function(n){(n.steps||[]).forEach(function(s){require(s[0]===null||ids.has(s[0]));});});
  d.edges.forEach(function(e){require(object(e)&&ids.has(e.s)&&ids.has(e.t)&&['see_also','contrasts_with'].includes(e.k)&&str(e.n));});
  ['next','prev','cooc'].forEach(function(key){
    require(object(d[key]));
    Object.keys(d[key]).forEach(function(id){require(ids.has(+id)&&Array.isArray(d[key][id]));
      // next/prev: [other, count]; cooc: [other, count, lift]
      d[key][id].forEach(function(t){require(Array.isArray(t)&&t.length===(key==='cooc'?3:2)&&ids.has(t[0])&&Number.isInteger(t[1])&&t[1]>0&&(key!=='cooc'||(Number.isFinite(t[2])&&t[2]>=0)));});
    });
  });
}

function build(d){
  var i,n,e;
  // Rebuild derived indexes only after the complete public contract validates.
  S={ready:false,byId:{},byName:{},nodes:[],goals:[],stages:[],tagById:{},seeAlso:{},contrasts:{},usedIn:{},next:{},prev:{},cooc:{},annScripts:0};
  LAYOUT=null;
  S.meta=d.meta||{};
  S.rawEdges=d.edges||[];
  S.nodes=d.nodes||[];
  [['goal',d.goals],['stage',d.stages]].forEach(function(pair){
    pair[1].forEach(function(t,ix){
      var tag={id:t.id,kind:pair[0],name:t.name,slug:t.name.replace(/^(goal|stage)-/,''),label:t.label,definition:t.definition||'',order:ix,members:[]};
      S.tagById[t.id]=tag; S[pair[0]+'s'].push(tag);
    });
  });
  for(i=0;i<S.nodes.length;i++){
    n=S.nodes[i];
    n._title=titleCase(n.name);
    S.byId[n.id]=n; S.byName[n.name]=n;
    n.goals.concat(n.stages).forEach(function(t){S.tagById[t].members.push(n);});
  }
  S.nodes.forEach(function(r){
    (r.steps||[]).forEach(function(st,ix){ if(st[0]!=null)(S.usedIn[st[0]]||(S.usedIn[st[0]]=[])).push({recipe:r.id,step:ix+1,text:st[1]}); });
  });
  S.recipes=S.nodes.filter(function(x){return x.kind==='recipe';}).sort(byStarter);

  var edges=d.edges||[];
  for(i=0;i<edges.length;i++){
    e=edges[i];
    if(!S.byId[e.s]||!S.byId[e.t]) continue;
    if(e.k==='see_also'){ addEdge(S.seeAlso,e.s,e.t,e.n); addEdge(S.seeAlso,e.t,e.s,e.n); }
    else if(e.k==='contrasts_with'){ addEdge(S.contrasts,e.s,e.t,e.n); addEdge(S.contrasts,e.t,e.s,e.n); }
  }
  Object.keys(S.seeAlso).forEach(function(k){ S.seeAlso[k].sort(byOtherName); });
  Object.keys(S.contrasts).forEach(function(k){ S.contrasts[k].sort(byOtherName); });

  /* sequence layers: next/prev = {id:[[other,count,share]...]}, cooc = {a:[[b,count,lift]...]} */
  S.next=d.next||{}; S.cooc=d.cooc||{}; S.prev=d.prev||{};
  S.annScripts=(S.meta.annotation_coverage||{}).annotated_units||0;
  if(window.Writer) Writer.restore();

  S.ready=true;
  document.getElementById('subline').innerHTML=
    '<b>'+S.nodes.length+'</b> entries · <b>'+S.recipes.length+'</b> recipes · <b>'+S.goals.length+'</b> goals · <b>'+S.stages.length+'</b> session stages';
  document.title=SITE;
}
function byName(a,b){ return a.name<b.name?-1:a.name>b.name?1:0; }
function bySeen(a,b){ return (b.annotation_units-a.annotation_units)||byName(a,b); }
/* Goal/stage/recipe lists: low risk first, self-contained before "needs an earlier install", then most seen. */
function byStarter(a,b){ return (riskRank(a)-riskRank(b))||((prerequisite(a)?1:0)-(prerequisite(b)?1:0))||bySeen(a,b); }
/* A recipe whose FIRST step fires something the listener must already have. */
var NEEDS_INSTALL=/\b(the|your|their|a known|an installed|an existing|that) (trigger|cue|anchor|trigger word|cue word|trained cue)s?\b|\b(that )?already (works|installed|trained)\b/i;
function prerequisite(n){
  if(n._pre!==undefined) return n._pre;
  var first=n.kind==='recipe'&&n.steps&&n.steps[0]?n.steps[0][1]:'';
  n._pre=!!first&&NEEDS_INSTALL.test(first)&&!/\b(install|pair|teach|build|condition)/i.test(first);
  return n._pre;
}
/* Where to install one first: install-stage trigger entries, recipes then lower risk then most seen. */
function installLinks(n){
  var trig=S.goals.filter(function(t){return t.slug==='triggers';})[0], inst=S.stages.filter(function(t){return t.slug==='install';})[0];
  if(!trig||!inst) return [];
  return trig.members.filter(function(x){return x.id!==n.id&&x.stages.indexOf(inst.id)>=0&&/(trigger|cue|anchor).*(install|condition)|(install|condition).*(trigger|cue|anchor)/.test(x.name)&&!prerequisite(x);})
    .sort(function(a,b){return ((a.kind==='recipe'?0:1)-(b.kind==='recipe'?0:1))||(riskRank(a)-riskRank(b))||bySeen(a,b);}).slice(0,2);
}
/* Variations: other recipes that use this one as a step (or are used by it), share two
   levers, or share a lever AND a goal. Most shared first, at most six. */
function relatedRecipes(n){
  if(n.kind!=='recipe') return [];
  var mine={}; (n.steps||[]).forEach(function(s){ if(s[0]!=null) mine[s[0]]=true; });
  var out=[];
  S.recipes.forEach(function(r){
    if(r.id===n.id) return;
    var shared=0, usesMe=!!mine[r.id];
    (r.steps||[]).forEach(function(s){ if(s[0]===n.id) usesMe=true; if(s[0]!=null&&mine[s[0]]) shared++; });
    var sameGoal=r.goals.some(function(g){return n.goals.indexOf(g)>=0;});
    if(usesMe||shared>=2||(shared>=1&&sameGoal)) out.push([r,(usesMe?10:0)+shared]);
  });
  return out.sort(function(a,b){return (b[1]-a[1])||bySeen(a[0],b[0]);}).slice(0,6).map(function(x){return x[0];});
}
function byOtherName(a,b){ var x=S.byId[a.o].name,y=S.byId[b.o].name; return x<y?-1:x>y?1:0; }
function addEdge(map,from,to,note){
  var arr=map[from]||(map[from]=[]);
  for(var i=0;i<arr.length;i++) if(arr[i].o===to){ if(!arr[i].n&&note) arr[i].n=note; return; }
  arr.push({o:to,n:note||''});
}

/* ============ router ============ */
function route(){
  if(!S.ready) return;
  var hadRoute=currentRoute!==null;
  var h=location.hash.replace(/^#\/?/,'');
  var parts=h.split('/');
  var view=document.getElementById('view');
  if(currentRoute!==null){
    if(currentRoute.startsWith('workbench')&&window.Writer&&Writer.rememberDetails) Writer.rememberDetails();
    var old=routeContext[currentRoute]||(routeContext[currentRoute]={});
    old.filter=memberFilter; old.risk=riskFilter; old.cross=crossFilter;
    var focused=document.activeElement;
    if(focused&&focused.classList.contains('knav')) old.focus=focused.getAttribute('href');
  }
  currentRoute=h;
  var context=routeContext[h]||{};
  memberFilter=context.filter||''; riskFilter=context.risk||''; crossFilter=context.cross||'';
  graphTeardown();
  document.querySelectorAll('header nav a').forEach(function(link){
    var active=link.getAttribute('href').split('/')[1]===parts[0];
    link.classList.toggle('on',active);
    if(active) link.setAttribute('aria-current','page'); else link.removeAttribute('aria-current');
  });
  var tag=(parts[0]==='goal'||parts[0]==='stage')?findTag(parts[0],parts[1]):null;
  if(tag)                                          renderTag(view,tag);
  else if(parts[0]==='recipes')                    renderRecipes(view);
  else if(parts[0]==='entry'&&S.byId[+parts[1]])   renderEntry(view,S.byId[+parts[1]]);
  else if(parts[0]==='table')                      Writer.renderTable(view);
  else if(parts[0]==='workbench') {
    if(parts[1]) { Writer.selected=parts[1].split(',').map(Number).filter((id,i,a)=>S.byId[id]&&a.indexOf(id)===i).slice(0,4); try {sessionStorage.setItem('writer-pins',JSON.stringify(Writer.selected));} catch(e){} Writer.updatePins(); }
    Writer.renderBoard(view);
  }
  else if(parts[0]==='timeline')                   renderTimeline(view);
  else if(parts[0]==='graph')                      renderGraph(view,parts[1]||'relations',parts[2]?+parts[2]:null);
  // Retired genus routes (#/genus, #/door, #/singletons) land on the home page.
  else if(!h||parts[0]==='genus'||parts[0]==='door'||parts[0]==='singletons') renderLanding(view);
  else view.innerHTML=crumbs([['#/','Home']],'Page unavailable')+'<section class="pagehead"><h2>Page unavailable</h2><p>This link does not match an entry or view in this edition.</p><p><a href="#/table">Browse all entries</a> or <a href="#/">search from the home page</a>.</p></section>';
  Writer.updatePins();
  var routeHeading=view.querySelector('h2');
  document.title=(routeHeading&&h?routeHeading.textContent+' · ':'')+SITE;
  view.setAttribute('aria-label',routeHeading?routeHeading.textContent:'Reference network');
  if(hadRoute && parts[0]!=='graph') {
    const heading=view.querySelector('h2');
    if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});}
  }
  window.scrollTo(0,context.scroll||0);
  if(context.focus){
    var links=view.querySelectorAll('a.knav');
    for(var i=0;i<links.length;i++) if(links[i].getAttribute('href')===context.focus){
      links[i].focus({preventScroll:true}); break;
    }
  }
}
window.addEventListener('hashchange',route);
function findTag(kind,slug){
  var list=kind==='goal'?S.goals:S.stages;
  for(var i=0;i<list.length;i++) if(list[i].slug===slug) return list[i];
  return null;
}

/* ============ home ============ */
function renderLanding(view){
  view.innerHTML=
    '<section class="writer-hero"><h2>Hypnosis, taken apart.</h2><p>An encyclopedia of hypnosis techniques: what each one does, how to do it, and why it works, with an honest grade for how sure anyone can be. '+LEVER_GLOSS+'</p>'+
    '<div class="searchwrap">'+
      '<input id="q" type="search" autocomplete="off" spellcheck="false" '+
        'placeholder="Search '+S.nodes.length+' entries: yes set, fractionation, triggers…" '+
        'value="'+esc(searchQuery)+'" aria-label="Search entries">'+
      '<p class="hint"><kbd>/</kbd> search &nbsp; <kbd>Esc</kbd> up a level &nbsp; <kbd>←→↑↓</kbd> move between rows</p>'+
    '</div></section>'+
    '<div id="results"></div>';
  var q=document.getElementById('q');
  q.addEventListener('input',function(){ searchQuery=q.value; renderResults(); });
  renderResults();
}

/* One count format everywhere a goal or stage is summarised (home tile = page head). */
function kindCounts(members){
  var c={recipe:0,technique:0,other:0};
  members.forEach(function(n){ c[n.kind==='recipe'||n.kind==='technique'?n.kind:'other']++; });
  return plural(c.recipe,'recipe','recipes')+' · '+plural(c.technique,'lever','levers')+
    (c.other?' · '+plural(c.other,'session structure or principle','session structures and principles'):'');
}
function tagTile(t,num){
  return '<a class="tile knav" href="'+tagHref(t)+'">'+
    '<span class="tname">'+(num?'<span class="tnum">'+num+'</span>':'')+esc(t.label)+'</span>'+
    '<span class="tdef">'+esc(t.definition)+'</span>'+
    '<span class="tcnt">'+kindCounts(t.members)+'</span></a>';
}
function recipeCard(n){
  return '<a class="rcard knav" href="#/entry/'+n.id+'"><span class="rname">'+esc(n._title)+riskBadge(n)+'</span>'+
    '<span class="rone">'+esc(n.one_liner||n.mech)+'</span>'+
    '<span class="rcnt">'+plural((n.steps||[]).length,'step','steps')+'</span></a>';
}

function renderResults(){
  var box=document.getElementById('results');
  if(!box) return;
  var q=searchQuery.trim();
  var html='';
  if(!q){
    var general=S.nodes.filter(function(n){return !n.goals.length;}).length;
    html+='<div class="secthead"><h2>What are you training?</h2><span class="n">'+S.goals.length+' goals</span></div>';
    html+='<div class="tiles">'+S.goals.map(function(t){return tagTile(t);}).join('')+'</div>';
    html+='<p class="hint">'+general+' entries are general craft (inductions, deepeners, emergence, safety) that serve every goal. Find them by session stage.</p>';
    html+='<div class="secthead"><h2>Where in the session?</h2><span class="n">'+S.stages.length+' stages, in order</span></div>';
    html+='<div class="tiles stages">'+S.stages.map(function(t,i){return tagTile(t,i+1);}).join('')+'</div>';
    html+='<div class="secthead"><h2>Recipes</h2><span class="n">named step-by-step routines · <a href="#/recipes">all '+S.recipes.length+' →</a></span></div>';
    html+='<div class="rshelf">'+S.recipes.slice(0,12).map(recipeCard).join('')+'</div>';
  }else{
    var nq=Writer.norm(q);
    var tags=S.goals.concat(S.stages).filter(function(t){return Writer.norm(t.label+' '+t.definition).indexOf(nq)>=0;});
    var hits=Writer.search(q);
    if(tags.length) html+='<div class="secthead"><h2>Goals and stages</h2><span class="n">'+tags.length+' match</span></div><div class="tiles">'+tags.map(function(t){return tagTile(t);}).join('')+'</div>';
    var CAP=60, shown=hits.slice(0,CAP);
    html+='<div class="secthead"><h2>Entries</h2><span class="n">'+(hits.length===1?'1 match':hits.length+' match')+

  document.getElementById('annotationFile').addEventListener('change',function(event){

    file.text().then(function(text){

      rows.forEach(function(row){

           !Number.isInteger(row.line_end)||row.line_start<1||row.line_end<row.line_start||
           (row.quote!=null&&typeof row.quote!=='string')) throw new Error('Each annotation needs an integer entry ID, valid line span, and optional text quote.');
      });
      timelineRows=rows.slice().sort(function(a,b){return a.line_start-b.line_start||a.line_end-b.line_end;});

      if(read===timelineRead&&currentRoute==='timeline') document.getElementById('timelineStatus').textContent='Could not open annotations: '+error.message+(timelineRows!==null?' The previous file remains displayed.':'');
    });

function paintTimeline(){
  if(timelineRows===null) return;

    var node=S.byId[row.entry_id]; if(!node) missing++;

// Density uses annotation line extent, not duration or inferred psychological state.
// Colored by each entry's earliest session stage.
function annotationDensity(rows){
  if(!rows.length) return '';
  var end=Math.max.apply(null,rows.map(function(r){return r.line_end;}));
  var bins=20, counts=[], stages={};
  for(var b=0;b<bins;b++) counts.push({});
  rows.forEach(function(row){
    var node=S.byId[row.entry_id]; if(!node) return;
    var st=node.stages.length?S.tagById[node.stages[0]].label:'No stage'; stages[st]=true;
    for(var i=0;i<bins;i++){
      var left=i*end/bins, right=(i+1)*end/bins;
      var overlap=Math.max(0,Math.min(row.line_end,right)-Math.max(row.line_start-1,left));
      if(overlap) counts[i][st]=(counts[i][st]||0)+overlap/(right-left);
    }
  });
  var order=S.stages.map(function(t){return t.label;}).concat(['No stage']);
  var names=order.filter(function(x){return stages[x];}), colors={};
  names.forEach(function(name){colors[name]=paletteColor(order.indexOf(name),name==='No stage');});
  var peak=Math.max(1,...counts.map(function(bin){return Object.keys(bin).reduce(function(n,k){return n+bin[k];},0);}));
  var html='<section class="sect"><p class="lab">Session stage across annotated lines</p>'+
    '<p class="seqnote">20 equal bins from line 1 to '+end+'. Height is summed annotation span per bin; overlaps count separately. This is not audio time or a measure of effect.</p>'+
    '<svg viewBox="0 0 800 140" role="img" aria-label="Stacked stage annotation density by source line" style="width:100%;height:auto">';
  counts.forEach(function(bin,i){
    var y=120;
    names.forEach(function(name){
      var value=bin[name]||0; if(!value)return;
      var height=110*value/peak; y-=height;
      html+='<rect x="'+(i*40)+'" y="'+y+'" width="38" height="'+height+'" fill="'+colors[name]+'"><title>'+esc(name)+
        ' · lines '+(Math.floor(i*end/bins)+1)+'–'+Math.ceil((i+1)*end/bins)+' · '+value.toFixed(1)+' span coverage</title></rect>';
    });
  });
  html+='</svg><p class="seqnote">'+names.map(function(name){return '<span style="display:inline-block;margin-right:12px"><span aria-hidden="true" style="color:'+colors[name]+'">●</span> '+esc(name)+'</span>';}).join('')+'</p></section>';
  return html;
}

/* One plain count, rounded stats, self-transitions shown as "repeated". */
function corpusSection(n){
  var units=n.annotation_units, nx=S.next[n.id]||[], pv=S.prev[n.id]||[], co=S.cooc[n.id]||[];
  var body='<p class="body small">'+(units?'Seen in <b>'+units+'</b> of the '+S.annScripts+' scripts and texts we annotated.':'Not yet counted in the scripts and texts we annotated.')+
    (n.repeats?' Often repeated back to back ('+plural(n.repeats,'time','times')+').':'')+'</p>';
  function chips(list,label,fmt){
    if(!list.length) return '';
    return '<div class="chips"><span class="seqnote chiplab">'+label+'</span>'+list.slice(0,6).map(function(t){var o=S.byId[t[0]];
      return o?'<a class="chip knav" href="#/entry/'+o.id+'">'+esc(o._title)+'<span class="st">'+fmt(t)+'</span></a>':'';}).join('')+'</div>';
  }
  body+=chips(pv,'Often comes after',function(t){return plural(t[1],'time','times');});
  body+=chips(nx,'Often followed by',function(t){return plural(t[1],'time','times');});
  body+=chips(co.slice(0,8),'Often in the same script as',function(t){return plural(t[1],'script','scripts')+liftText(t[1],t[2]);});

/* --- layout: precomputed at publish time (nodes carry x/y), cached per load --- */

/* --- per-mode edge lists for DRAWING --- */

  var edges=[], seen={};

    S.nodes.forEach(function(n){

      (S.contrasts[n.id]||[]).forEach(function(s){
        var k=n.id<s.o?n.id+'_'+s.o:s.o+'_'+n.id;

/* ============ keyboard ============ */
document.addEventListener('keydown',function(e){
  if(!S.ready || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;

  if(e.key==='/'&&!inInput){
    e.preventDefault();
    var q=document.getElementById('tableQuery')||document.getElementById('memberFilter')||document.getElementById('q')||document.getElementById('gsearch');
    if(q){ q.focus(); q.select(); }
    else{
      location.hash='#/';
      setTimeout(function(){ var qq=document.getElementById('q'); if(qq){ qq.focus(); qq.select(); } },0);
    }
    return;
  }

  if(e.key==='Escape'){
    if(inInput && !(tgt.tagName==='INPUT' && tgt.type==='search')) return;
    if(inInput){
      if(tgt.value){ tgt.value=''; tgt.dispatchEvent(new Event('input')); }
      else tgt.blur();
      return;
    }
    var h=location.hash.replace(/^#\/?/,''), parts=h.split('/');
    if(parts[0]==='entry'){
      var node=S.byId[+parts[1]];
      if(node&&node.kind==='recipe') location.hash='#/recipes';
      else if(node&&node.stages.length) location.hash=tagHref(S.tagById[node.stages[0]]);
      else location.hash='#/';
    }
    else if(parts[0]==='graph'&&G&&G.sel!=null){ graphClear(); }
    else if(parts[0]!=='') location.hash='#/';
    return;
  }

  if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowDown'){
    if(inInput || (tgt && ['BUTTON','SUMMARY','CANVAS'].includes(tgt.tagName))) return;
    var items=Array.prototype.slice.call(document.querySelectorAll('.knav'));
    if(!items.length) return;
    var cur=items.indexOf(document.activeElement);
    if(cur<0) return;
    var next=-1;
    if(e.key==='ArrowLeft')  next=cur-1;
    if(e.key==='ArrowRight') next=cur+1;
    if(e.key==='ArrowUp'||e.key==='ArrowDown'){
      next=nearestVertical(items,cur,e.key==='ArrowDown'?1:-1);
    }
    if(next>=0&&next<items.length){
      items[next].focus();
      items[next].scrollIntoView({block:'nearest'});
      e.preventDefault();
    }
  }
});

function nearestVertical(items,cur,dir){
  var me=items[cur].getBoundingClientRect();
  var myTop=me.top+window.scrollY, myX=me.left+me.width/2;
  var best=-1,bestDy=Infinity,bestDx=Infinity;
  for(var i=0;i<items.length;i++){
    if(i===cur) continue;
    var r=items[i].getBoundingClientRect();
    var top=r.top+window.scrollY;
    var dy=(top-myTop)*dir;
    if(dy<=2) continue;
    var dx=Math.abs(r.left+r.width/2-myX);
    if(dy<bestDy-2||(Math.abs(dy-bestDy)<=2&&dx<bestDx)){ best=i; bestDy=dy; bestDx=dx; }
  }
  return best;
}

</script>
