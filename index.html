<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hypnotic Devices</title>
<meta name="description" content="An encyclopedia of hypnotic and rhetorical devices: what each one is, how to write it, how to spot it.">
<style>
:root{
  --bg:#f7f5f0;--panel:#fffdf8;--ink:#1d1b18;--muted:#6a645b;--line:#e2ddd2;--accent:#7a3b6b;--accent-ink:#fff;
  --chip:#efeae0;--quote:#f1ecdf;--warn:#8a4b12;--warn-bg:#fbf0dc;--good:#2f6b4f;
  --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:Georgia,"Iowan Old Style","Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17151a;--panel:#1f1c23;--ink:#ece7ee;--muted:#a59daa;--line:#34303a;--accent:#d49ac6;--accent-ink:#1b141a;
  --chip:#2a2630;--quote:#25212b;--warn:#f0c079;--warn-bg:#33291a;--good:#8fd0ae;}}
:root[data-theme="dark"]{
  --bg:#17151a;--panel:#1f1c23;--ink:#ece7ee;--muted:#a59daa;--line:#34303a;--accent:#d49ac6;--accent-ink:#1b141a;
  --chip:#2a2630;--quote:#25212b;--warn:#f0c079;--warn-bg:#33291a;--good:#8fd0ae;}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--font)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:100%}
aside{border-right:1px solid var(--line);background:var(--panel);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{padding:16px 16px 8px;font:600 19px var(--serif)}
.brand a{color:var(--ink)}
.brand small{display:block;font:400 12.5px var(--font);color:var(--muted);margin-top:2px}
.search{padding:6px 16px 10px}
.search input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
nav.top{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px;border-bottom:1px solid var(--line)}
nav.top a{font-size:13px;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--ink)}
nav.top a.on{background:var(--accent);color:var(--accent-ink)}
.tree{overflow:auto;padding:8px 8px 24px;flex:1}
.tree details{margin:0}
.tree summary{cursor:pointer;padding:5px 8px;border-radius:6px;font-weight:600;font-size:14.5px;list-style:none;display:flex;justify-content:space-between;gap:8px}
.tree summary::-webkit-details-marker{display:none}
.tree summary:hover,.tree a.item:hover{background:var(--chip);text-decoration:none}
.tree summary .n{color:var(--muted);font-weight:400;font-size:12.5px}
.tree .kids{margin-left:10px;border-left:1px solid var(--line);padding-left:4px}
.tree a.item{display:block;padding:3px 8px;border-radius:6px;color:var(--ink);font-size:14px}
.tree a.item.v{padding-left:20px;color:var(--muted)}
.tree a.item.on{background:var(--accent);color:var(--accent-ink)}
.hits a{display:block;padding:7px 8px;border-radius:6px;color:var(--ink)}
.hits a:hover{background:var(--chip);text-decoration:none}
.hits small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
main{padding:28px clamp(16px,4vw,56px) 80px;max-width:900px;min-width:0}
h1{font:600 clamp(26px,4vw,36px)/1.15 var(--serif);margin:.1em 0 .25em}
h2{font:600 13px var(--font);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:1.9em 0 .5em}
.crumb{font-size:13.5px;color:var(--muted)}
.lead{font:400 19px/1.5 var(--serif);margin:.3em 0 .8em}
.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--chip);margin-right:6px;vertical-align:middle}
.badge.k{background:var(--accent);color:var(--accent-ink)}
.aka{color:var(--muted);font-size:14.5px}
blockquote{margin:.5em 0;padding:10px 14px;background:var(--quote);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;font:italic 16.5px/1.5 var(--serif)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span,.chips a{background:var(--chip);border-radius:8px;padding:4px 10px;font-size:14px;color:var(--ink)}
ul.plain{list-style:none;padding:0;margin:0}
ul.plain li{padding:7px 0;border-bottom:1px solid var(--line)}
ul.plain li small{color:var(--muted);display:block}
.note{background:var(--warn-bg);color:var(--warn);padding:10px 14px;border-radius:8px;font-size:15px}
.ev{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel)}
.ev b{text-transform:capitalize}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{display:block;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel);color:var(--ink)}
.card:hover{border-color:var(--accent);text-decoration:none}
.card b{font:600 17px var(--serif);display:block}
.card small{color:var(--muted);display:block;margin-top:4px;line-height:1.4}
.card .n{font-size:12.5px;color:var(--accent);margin-top:8px;display:block}
ol.steps li{margin:.4em 0}
details.fold{margin-top:1.5em;color:var(--muted);font-size:14px}
.menu{display:none}
table{border-collapse:collapse;width:100%;font-size:14.5px}
td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:.9em}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 auto 0 0;width:min(88vw,330px);z-index:5;transform:translateX(-102%);transition:transform .18s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  aside.open{transform:none}
  .menu{display:inline-block;margin-bottom:12px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer}
  main{padding:16px 16px 60px}
}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand"><a href="#/">Hypnotic Devices</a><small>What a writer can do, and how to spot it</small></div>
    <div class="search"><input id="q" type="search" placeholder="Search: yes set, double bind, anaphora" autocomplete="off" aria-label="Search devices"></div>
    <nav class="top" id="topnav"></nav>
    <div class="tree" id="tree"></div>
  </aside>
  <main><button class="menu" id="menu">Browse</button><div id="view">Loading.</div></main>
</div>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const KIND = {family:"Family", unit:"Device", variant:"Variant", recipe:"Recipe", structure:"Structure", delivery:"Delivery"};
const STAGES = [["pretalk","Pre-talk"],["induction","Induction"],["deepening","Deepening"],["suggestion","Suggestion"],["convincer","Convincer"],["emergence","Emergence"],["post-session","After the session"]];
const GRADE = {
  "experimental":"Experimental: the effect has controlled studies behind it.",
  "clinical-tradition":"Clinical tradition: standard in clinical hypnosis texts; not necessarily tested in isolation.",
  "practitioner-lore":"Practitioner lore: taught in NLP, stage or community practice without independent validation.",
  "rhetorical-tradition":"Rhetorical tradition: a classical figure of style.",
  "contested":"Contested: studied, with mixed or failed replication."};
let D, by = {}, kids = {}, tby = {}, idx = [];

// Published, the data sits next to this page. In the working repo it is in ../dist/.
let BASE = "";
const load = base => fetch(base + "devices.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(d => { BASE = base; return d; });
load("").catch(() => load("../dist/")).then(d => { D = d; init(); }).catch(e => { $("#view").textContent = "Could not load devices.json (" + e.message + "). Reload the page to try again."; });

function init() {
  for (const e of D.entries) { by[e.id] = e; (kids[e.parent || ""] = kids[e.parent || ""] || []).push(e); }
  for (const t of D.theory) tby[t.id] = t;
  for (const e of D.entries) idx.push({e, name: norm(e.name), id: norm(e.id), aka: (e.aliases || []).map(norm), text: norm(e.summary + " " + (e.cues || []).join(" ")), more: norm([e.definition, e.how_to, e.why, (e.evidence || {}).note, ...(e.not_this || []).map(n => n.why)].filter(Boolean).join(" "))});
  for (const t of D.theory) idx.push({t, name: norm(t.name), id: norm(t.id), aka: [], text: norm(t.summary), more: norm([t.claim, t.evidence_note, t.writer_takeaway].filter(Boolean).join(" "))});
  $("#topnav").innerHTML = [["#/","Devices"],["#/stages","By stage"],["#/theory","Theory"],["#/label","Label a script"],["#/about","About"]].map(([h, l]) => `<a href="${h}">${l}</a>`).join("");
  buildTree();
  $("#q").addEventListener("input", search);
  $("#menu").addEventListener("click", () => $("#side").classList.toggle("open"));
  addEventListener("hashchange", route);
  route();
}
function count(e) { let n = 0; for (const c of kids[e.id] || []) n += (c.kind === "family" ? count(c) : 1 + count(c)); return n; }
function treeNode(e) {
  if (e.kind === "family") return `<details data-id="${e.id}"><summary><a href="#/e/${e.id}" style="color:inherit">${esc(e.name)}</a><span class="n">${count(e)}</span></summary><div class="kids">${(kids[e.id] || []).map(treeNode).join("")}</div></details>`;
  return `<a class="item${e.kind === "variant" ? " v" : ""}" data-id="${e.id}" href="#/e/${e.id}">${esc(e.name)}</a>` + (kids[e.id] || []).map(treeNode).join("");
}
function buildTree() { $("#tree").innerHTML = (kids[""] || []).map(treeNode).join(""); }
function search() {
  const q = norm($("#q").value);
  if (!q) { buildTree(); mark(); return; }
  const words = q.split(" ");
  const hits = [];
  for (const r of idx) {
    let s = 0;
    if (r.name === q || r.id === q) s = 100; else if (r.aka.includes(q)) s = 90;
    else if (r.name.startsWith(q)) s = 80; else if (r.name.includes(q)) s = 70;
    else if (r.aka.some(a => a.includes(q))) s = 60; else if (words.every(w => (r.name + " " + r.aka.join(" ") + " " + r.text).includes(w))) s = 20;
    else if (words.every(w => (r.name + " " + r.aka.join(" ") + " " + r.text + " " + r.more).includes(w))) s = 10;
    if (s) hits.push([s, r]);
  }
  hits.sort((a, b) => b[0] - a[0] || a[1].name.localeCompare(b[1].name));
  $("#tree").innerHTML = `<div class="hits">${hits.slice(0, 60).map(([, r]) => r.e
    ? `<a href="#/e/${r.e.id}"><b>${esc(r.e.name)}</b> <span class="badge">${KIND[r.e.kind]}</span><small>${esc(r.e.summary)}</small></a>`
    : `<a href="#/t/${r.t.id}"><b>${esc(r.t.name)}</b> <span class="badge">Theory</span><small>${esc(r.t.summary)}</small></a>`).join("") || "<p style='padding:8px;color:var(--muted)'>Nothing found.</p>"}</div>`;
}
function mark(id) {
  document.querySelectorAll(".tree .on").forEach(x => x.classList.remove("on"));
  if (!id) return;
  const el = $(`.tree a.item[data-id="${CSS.escape(id)}"]`);
  let cur = by[id];
  while (cur) { const d = $(`.tree details[data-id="${CSS.escape(cur.id)}"]`); if (d) d.open = true; cur = by[cur.parent]; }
  if (el) { el.classList.add("on"); el.scrollIntoView({block: "center"}); }
}
const link = id => by[id] ? `<a href="#/e/${id}">${esc(by[id].name)}</a>` : esc(id);
const sec = (title, body) => body ? `<h2>${title}</h2>${body}` : "";
function crumbs(e) { const out = []; let c = by[e.parent]; while (c) { out.unshift(link(c.id)); c = by[c.parent]; } return out.length ? `<div class="crumb">${out.join(" / ")}</div>` : ""; }

function entryPage(e) {
  const ch = kids[e.id] || [];
  const chList = ch.length ? `<ul class="plain">${ch.map(c => `<li><a href="#/e/${c.id}"><b>${esc(c.name)}</b></a> <span class="badge">${KIND[c.kind]}</span><small>${esc(c.summary)}</small></li>`).join("")}</ul>` : "";
  const ev = e.evidence || {}, src = (e.origin || {}).source, srcUrl = /^https?:\/\//.test((e.origin || {}).url || "") ? e.origin.url : null;
  let h = crumbs(e) + `<h1>${esc(e.name)}</h1><div><span class="badge k">${KIND[e.kind]}</span>` +
    (e.text_detectable && e.text_detectable !== "yes" ? `<span class="badge">${e.text_detectable === "no" ? "heard, not read" : "partly visible in text"}</span>` : "") +
    (e.stages || []).filter(s => s !== "any").map(s => `<span class="badge">${esc((STAGES.find(x => x[0] === s) || [s, s])[1])}</span>`).join("") + `</div>`;
  if ((e.aliases || []).length) h += `<p class="aka">Also called: ${e.aliases.map(esc).join(", ")}</p>`;
  h += `<p class="lead">${esc(e.summary)}</p><p>${esc(e.definition)}</p>`;
  const notThis = sec("Not to be confused with", (e.not_this || []).length ? `<ul class="plain">${e.not_this.map(x => `<li>${link(x.id)}<small>${esc(x.why)}</small></li>`).join("")}</ul>` : "");
  const whyIt = sec("Why it works", (e.why || []).length ? `<div class="chips">${e.why.filter(w => tby[w]).map(w => `<a href="#/t/${w}">${esc(tby[w].name)}</a>`).join("")}</div>` : "");
  const consent = e.consent_note ? sec("Consent", `<div class="note">${esc(e.consent_note)}</div>`) : "";
  if (e.kind === "family") h += sec("Choosing among them", `<p>${esc(e.how_to)}</p>`) + sec("In this family", chList) + notThis + whyIt + consent;
  else {
    h += sec("How to write it", `<p>${esc(e.how_to)}</p>`);
    if ((e.steps || []).length) h += sec("Steps", `<ol class="steps">${e.steps.map(s => `<li>${esc(s.text)}${by[s.device] ? ` <span class="aka">(${link(s.device)})</span>` : ""}</li>`).join("")}</ol>`);
    h += sec("Examples", (e.examples || []).map(x => `<blockquote>${esc(x)}</blockquote>`).join(""));
    h += sec("Spot it by", (e.cues || []).length ? `<div class="chips">${e.cues.map(c => `<span>${esc(c)}</span>`).join("")}</div>` : "");
    h += notThis;
    h += sec("Named variants", chList);
    h += sec("Often used with", (e.related || []).length ? `<div class="chips">${e.related.map(r => `<a href="#/e/${r}">${esc(by[r] ? by[r].name : r)}</a>`).join("")}</div>` : "");
    h += sec("Evidence", `<div class="ev"><b>${esc((ev.grade || "").replace("-", " "))}.</b> ${esc(ev.note || "")}${src ? `<br><span class="aka">Source: ${srcUrl ? `<a href="${esc(srcUrl)}" rel="noopener">${esc(src)}</a>` : esc(src)}</span>` : ""}<br><span class="aka">${esc(GRADE[ev.grade] || "")}</span></div>`);
    h += whyIt + consent;
  }
  h += `<details class="fold"><summary>Label id</summary><p><code>${esc(e.id)}</code></p></details>`;
  return h;
}
function theoryPage(t) {
  const st = {E: "Empirical construct", T: "Theoretical framework", P: "Practitioner vocabulary"}[t.status] || t.status;
  const used = D.entries.filter(e => (e.why || []).includes(t.id));
  return `<div class="crumb"><a href="#/theory">Theory</a> / ${esc(t.section)}</div><h1>${esc(t.name)}</h1><div><span class="badge k">Theory</span><span class="badge">${st}</span></div>
    <p class="lead">${esc(t.summary)}</p><p>${esc(t.claim)}</p>${sec("How well supported", `<p>${esc(t.evidence_note)}</p>${t.source ? `<p class="aka">Source: ${/^https?:\/\//.test(t.source_url || "") ? `<a href="${esc(t.source_url)}" rel="noopener">${esc(t.source)}</a>` : esc(t.source)}</p>` : ""}`)}
    ${sec("For writers", `<p>${esc(t.writer_takeaway)}</p>`)}${sec("Devices it helps explain", used.length ? `<div class="chips">${used.map(e => `<a href="#/e/${e.id}">${esc(e.name)}</a>`).join("")}</div>` : "")}`;
}
function home() {
  const k = D.meta.kinds || {};
  return `<h1>Hypnotic and rhetorical devices</h1><p class="lead">A reference of things a writer can do in a script: what each device is, how to write it, how to recognize it, and how well supported it is.</p>
  <p>${(k.unit || 0)} devices and ${(k.variant || 0)} named variants in ${(kids[""] || []).length} families, plus ${(k.recipe || 0)} recipes, ${(k.structure || 0)} session structures and ${D.theory.length} theory notes. Every device is one move with a plain name. Compounds, scenes and themes are left out on purpose; see <a href="#/about">About</a>.</p>
  <div class="cards">${(kids[""] || []).map(f => `<a class="card" href="#/e/${f.id}"><b>${esc(f.name)}</b><small>${esc(f.summary)}</small><span class="n">${count(f)} entries</span></a>`).join("")}</div>`;
}
// A device tagged for most stages belongs to none in particular; list it only where it is specific.
const atStage = (e, s) => e.kind !== "family" && (e.stages || []).includes(s === "throughout" ? "any" : s);
const STAGE_PAGES = STAGES.concat([["throughout","Throughout the session"]]);
function stagesPage(s) {
  if (!s) return `<h1>By stage</h1><p class="lead">Each device is listed under every stage it is used in. Devices that work at any point are under Throughout the session.</p><div class="cards">${STAGE_PAGES.map(([id, l]) => `<a class="card" href="#/stages/${id}"><b>${l}</b><span class="n">${D.entries.filter(e => atStage(e, id)).length} entries</span></a>`).join("")}</div>`;
  const lab = (STAGE_PAGES.find(x => x[0] === s) || [s, s])[1];
  const list = D.entries.filter(e => atStage(e, s));
  const g = {}; for (const e of list) (g[e.family] = g[e.family] || []).push(e);
  return `<div class="crumb"><a href="#/stages">By stage</a></div><h1>${esc(lab)}</h1>` + Object.keys(g).map(f => `<h2>${esc(by[f].name)}</h2><ul class="plain">${g[f].map(e => `<li>${link(e.id)} <span class="badge">${KIND[e.kind]}</span><small>${esc(e.summary)}</small></li>`).join("")}</ul>`).join("");
}
function theoryIndex() {
  const g = {}; for (const t of D.theory) (g[t.section] = g[t.section] || []).push(t);
  return `<h1>Theory</h1><p class="lead">Why devices work. Background for writers; not something to label in a script.</p><p class="aka">E = empirical construct, T = theoretical framework, P = practitioner vocabulary.</p>` +
    Object.keys(g).map(s => `<h2>${esc(s)}</h2><ul class="plain">${g[s].map(t => `<li><a href="#/t/${t.id}"><b>${esc(t.name)}</b></a> <span class="badge">${t.status}</span><small>${esc(t.summary)}</small></li>`).join("")}</ul>`).join("");
}
function about() {
  return `<h1>About this reference</h1><p class="lead">A device is listed here only if it is one move, has a plain name, works whatever the theme, and can be pointed at in the text.</p>
  <h2>Kinds of entry</h2><table><tr><td><b>Device</b></td><td>One thing a writer does.</td></tr><tr><td><b>Variant</b></td><td>A named, narrower form of one device. A yes set is a variant of the compliance ladder.</td></tr><tr><td><b>Recipe</b></td><td>A named, ordered combination of devices.</td></tr><tr><td><b>Structure</b></td><td>A session-scale part or shape. Where devices go.</td></tr><tr><td><b>Delivery</b></td><td>A voice or audio choice: heard, not read.</td></tr><tr><td><b>Theory</b></td><td>Why devices work. Not labelable.</td></tr></table>
  <h2>Evidence grades</h2><table>${Object.entries(GRADE).map(([k, v]) => `<tr><td><b>${k.replace("-", " ")}</b></td><td>${esc(v.split(": ")[1])}</td></tr>`).join("")}</table><p class="aka">A grade rates what is known about the device. It is never a promise that a line will work on a given listener.</p>
  <h2>Consent</h2><p>This is a reference for consensual hypnosis and for recognizing influence. Entries that depend on the listener not noticing, that persist after a session, or that come from coercive-control research carry a consent note. Used on someone who has not agreed, those are abuse.</p>
  <h2>Licence</h2><p>Content: CC BY-SA 4.0.</p>`;
}
function labelPage() {
  return `<h1>Label a script</h1><p class="lead">The catalog is built so an agent or a person can mark up a script device by device.</p>
  <p>Give a labeling agent <a href="${BASE}catalog.md">catalog.md</a> (or <a href="${BASE}catalog.json">catalog.json</a>) and the script. For each span it should return the line range, the exact quote, the device id, a confidence, and one sentence saying which cue it matched. A variant label also counts as its parent. Spans may overlap: a single line can be a presupposition inside a yes set.</p>
  <h2>Rules that keep labels honest</h2><ul><li>Label only what is in the wording. Themes and plot are not devices.</li><li>Use the most specific id that fits; fall back to the parent when unsure.</li><li>Quote exactly, so a checker can find the span.</li><li>If nothing fits, say so. Do not stretch a device to cover a line.</li></ul>
  <p>Files: <a href="${BASE}catalog.md">catalog.md</a>, <a href="${BASE}catalog.json">catalog.json</a>, <a href="${BASE}devices.json">devices.json</a> (everything), <a href="${BASE}book.md">book.md</a> (long form).</p>`;
}
function route() {
  const p = decodeURIComponent(location.hash.replace(/^#\/?/, "")).split("/");
  let h, id = null;
  if (p[0] === "e" && by[p[1]]) { h = entryPage(by[p[1]]); id = p[1]; document.title = by[p[1]].name + " - Hypnotic Devices"; }
  else if (p[0] === "t" && tby[p[1]]) { h = theoryPage(tby[p[1]]); document.title = tby[p[1]].name + " - Hypnotic Devices"; }
  else {
    h = p[0] === "theory" ? theoryIndex() : p[0] === "stages" ? stagesPage(p[1]) : p[0] === "about" ? about() : p[0] === "label" ? labelPage() : home();
    document.title = ({theory: "Theory - ", stages: "By stage - ", about: "About - ", label: "Label a script - "}[p[0]] || "") + "Hypnotic Devices";
  }
  $("#view").innerHTML = h;
  document.querySelectorAll("#topnav a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === "#/" + (["theory", "stages", "about", "label"].includes(p[0]) ? p[0] : "")));
  if (!$("#q").value) mark(id);
  $("#side").classList.remove("open");
  scrollTo(0, 0);
}
</script>
</body>
</html>
