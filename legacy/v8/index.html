<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hypnosis Taxonomy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='5' cy='8' r='2.6' fill='%232361ae'/%3E%3Ccircle cx='11.5' cy='4.5' r='1.9' fill='%23888'/%3E%3Ccircle cx='11.5' cy='11.5' r='1.9' fill='%23888'/%3E%3Cpath d='M6.8 7.2 10 5.1M6.8 8.8 10 10.9' stroke='%23888' stroke-width='1.1'/%3E%3C/svg%3E">
<link rel="stylesheet" href="writer-tools.css">
<style>
  :root {
    color-scheme: light;
    --surface-0:#f6f6f4; --surface-1:#fdfdfc; --surface-2:#efefeb;
    --line:#e2e2dd; --line-2:#d2d2cb;
    --ink-1:#101010; --ink-2:#4e4d4a; --ink-3:#6b6a64; --ink-4:#aaa9a1;
    --accent:#2361ae; --accent-soft:rgba(35,97,174,.09);
    --warn:#a05a1f; --high:#a03a2e; --low:#4f6b2a;
    --g-est:#14684f; --g-sup:#1e8a68;
    --gt-est:rgba(35,97,174,.30); --gt-sup:rgba(35,97,174,.13); --gt-pla:transparent; --gt-spe:transparent;
    --shadow:0 6px 24px rgba(0,0,0,.12);
    /* One type scale: every font-size on the site is one of these. */
    --fs-xs:12px; --fs-s:13px; --fs-m:15px; --fs-l:18px; --fs-xl:26px; --fs-hero:clamp(30px,4vw,46px);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-0:#121211; --surface-1:#1a1a19; --surface-2:#242423;
      --line:#2f2f2c; --line-2:#403f3a;
      --ink-1:#f4f4f1; --ink-2:#b8b7ae; --ink-3:#97968d; --ink-4:#5e5d57;
      --accent:#5b93d8; --accent-soft:rgba(91,147,216,.13);
      --warn:#c98a4b; --high:#c9685a; --low:#9fbf72;
      --g-est:#5fd0a8; --g-sup:#58b896;
      --gt-est:rgba(91,147,216,.42); --gt-sup:rgba(91,147,216,.20); --gt-pla:transparent; --gt-spe:transparent;
      --shadow:0 6px 24px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0:#121211; --surface-1:#1a1a19; --surface-2:#242423;
    --line:#2f2f2c; --line-2:#403f3a;
    --ink-1:#f4f4f1; --ink-2:#b8b7ae; --ink-3:#97968d; --ink-4:#5e5d57;
    --accent:#5b93d8; --accent-soft:rgba(91,147,216,.13);
    --warn:#c98a4b; --high:#c9685a; --low:#9fbf72;
    --g-est:#5fd0a8; --g-sup:#58b896;
    --gt-est:rgba(91,147,216,.42); --gt-sup:rgba(91,147,216,.20); --gt-pla:transparent; --gt-spe:transparent;
    --shadow:0 6px 24px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  html{overflow-x:clip}
  body{
    background:var(--surface-0); color:var(--ink-1);
    font:var(--fs-m)/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:clip; overflow-wrap:break-word;
  }
  a{color:inherit}

  header{
    max-width:1200px;margin:0 auto;padding:14px 24px 0;
    display:flex;flex-wrap:wrap;align-items:center;gap:0 16px;
  }
  h1{margin:0;font-size:var(--fs-l);font-weight:650;letter-spacing:-.01em}
  h1 a{text-decoration:none}
  h1 a:hover{color:var(--accent)}
  .sub{color:var(--ink-3);font-size:var(--fs-s);margin:0 0 14px;font-variant-numeric:tabular-nums}
  .hbtn{
    border:1px solid var(--line-2);background:var(--surface-1);color:var(--ink-2);
    border-radius:6px;padding:5px 12px;font:inherit;font-size:var(--fs-s);cursor:pointer;
    text-decoration:none;
  }
  .hbtn:hover{color:var(--ink-1);border-color:var(--ink-4)}
  .hbtn.on{border-color:var(--accent);color:var(--accent)}
  nav.primary{display:flex;flex-wrap:nowrap;gap:0 4px;margin-left:auto}
  nav.primary a{font-size:var(--fs-s);line-height:20px;padding:12px 8px;color:var(--ink-2);text-decoration:none;white-space:nowrap}
  nav.primary a:hover{color:var(--ink-1)}
  nav.primary a.on{color:var(--ink-1);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px}
  nav.primary a:focus-visible,.iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
  .iconbtn{border:0;background:none;color:var(--ink-2);width:44px;height:44px;padding:0;display:inline-grid;place-items:center;cursor:pointer;border-radius:8px}
  .iconbtn:hover{color:var(--ink-1);background:var(--surface-2)}
  .iconbtn svg{width:18px;height:18px}

  main{max-width:1200px;margin:0 auto;padding:16px 24px 72px}

  .crumbs{font-size:var(--fs-s);color:var(--ink-2);margin:4px 0 16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .crumbs a{text-decoration:none}
  .crumbs a:hover{color:var(--accent)}
  .crumbs .sep{color:var(--ink-3)}
  .crumbs .here{color:var(--ink-2)}

  .searchwrap{margin:10px 0 20px;max-width:640px}
  input[type=search]{
    width:100%;border:1px solid var(--line-2);background:var(--surface-1);color:var(--ink-1);
    border-radius:8px;padding:10px 14px;font:inherit;font-size:var(--fs-m);
  }
  input[type=search]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  .hint{color:var(--ink-2);font-size:var(--fs-xs);margin:7px 2px 0}
  kbd{
    font:var(--fs-xs) ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--line-2);
    border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--surface-1);color:var(--ink-2);
  }

  .secthead{display:flex;align-items:baseline;gap:12px;margin:26px 0 10px}
  .secthead h2{margin:0;font-size:var(--fs-s);font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2)}
  .secthead .n{color:var(--ink-2);font-size:var(--fs-s);font-variant-numeric:tabular-nums}

  /* home: goal / stage tiles and the recipe shelf */
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .tile{display:flex;flex-direction:column;gap:5px;padding:13px 15px;border:1px solid var(--line);border-radius:10px;
        background:var(--surface-1);text-decoration:none}
  .tile:hover{border-color:var(--accent);background:var(--accent-soft)}
  .tile:focus-visible,.rcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tname{font-weight:650;font-size:var(--fs-m)}
  .tnum{display:inline-block;min-width:20px;height:20px;border-radius:4px;background:var(--accent-soft);color:var(--accent);
        font-size:var(--fs-xs);text-align:center;line-height:20px;margin-right:8px;font-variant-numeric:tabular-nums}
  .tdef{color:var(--ink-2);font-size:var(--fs-s);line-height:1.45}
  .tcnt{color:var(--ink-3);font-size:var(--fs-xs);margin-top:auto;font-variant-numeric:tabular-nums}
  .rshelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
  .rcard{display:flex;flex-direction:column;gap:5px;padding:13px 15px;border-left:3px solid var(--accent);
         background:var(--surface-1);border-radius:0 10px 10px 0;text-decoration:none}
  .rcard:hover{background:var(--accent-soft)}
  .rname{font-weight:650}
  .rone{color:var(--ink-2);font-size:var(--fs-s);line-height:1.45}
  .rcnt{color:var(--ink-3);font-size:var(--fs-xs)}
  .kindline{margin:0 0 6px;font-size:var(--fs-xs);font-weight:650;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
  .kindline a{color:var(--ink-2);text-decoration:none}
  .kindline a:hover{color:var(--accent);text-decoration:underline}
  .kindline .kin{text-transform:none;letter-spacing:0;font-weight:400}
  .entry .lead{font-size:var(--fs-l);line-height:1.5;margin:0 0 6px;color:var(--ink-1);max-width:62ch}
  ol.steps{margin:0;padding-left:22px}
  ol.steps li{margin:0 0 10px;padding-left:4px}
  ol.steps li p{margin:0;font-size:var(--fs-m);line-height:1.55}
  .steplever{display:inline-block;margin-top:3px;font-size:var(--fs-s);color:var(--accent);text-decoration:none}
  .steplever::before{content:"↳ ";color:var(--ink-3)}
  ul.variations{margin:4px 0 0;padding-left:20px;font-size:var(--fs-m);line-height:1.55}
  ul.variations li{margin:0 0 4px}
  .grade{margin:10px 0 0;font-size:var(--fs-s);color:var(--ink-2)}
  .grade b{color:var(--ink-1);font-weight:600}
  .entry .meta .grade-badge{margin-right:0}
  .grade-badge{display:inline-block;font-size:var(--fs-xs);font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:4px;
               padding:1px 7px;margin-right:6px;border:1px solid currentColor}
  /* A neutral ramp: grades never borrow the care colours (--warn/--high/--low mean care only).
     Established is the only FILLED badge; the line gets lighter and looser as evidence thins. */
  a.grade-badge{text-decoration:none}
  a.grade-badge:hover{text-decoration:underline}
  .g-established{color:var(--ink-1);background:var(--gt-est);border-color:var(--ink-1);box-shadow:inset 0 0 0 1px var(--ink-1)}
  .g-supported{color:var(--ink-1);background:var(--gt-sup)}.g-plausible{color:var(--ink-1);background:var(--gt-pla);border-color:var(--ink-2)}
  .g-speculative{color:var(--ink-2);background:var(--gt-spe);border-color:var(--ink-3);border-style:dashed}.g-folk{color:var(--ink-2);border-color:var(--ink-3);border-style:dotted}
  .finding{margin:6px 0 0;font-size:var(--fs-s);color:var(--ink-2)}
  .finding a{color:var(--accent)}
  .prereq{margin:0 0 16px;padding:10px 14px;border-left:3px solid var(--warn);background:var(--surface-1);border-radius:0 8px 8px 0;font-size:var(--fs-s);color:var(--ink-2)}
  .prereq b{color:var(--ink-1)}
  .risklegend{font-size:var(--fs-s);margin:-4px 0 12px}
  .risklegend a{color:var(--accent)}
  .leaveout{position:relative}
  /* .ctl: ONE look for every filter control (select, text box, Leave out, the narrow Filters toggle). */
  .ctl,.writer-filters input:not([type=checkbox]),.writer-filters select,.leaveout>summary,.morefilters>summary{font-family:inherit;font-weight:400;font-size:var(--fs-s);line-height:1.3;height:36px;
    border:1px solid var(--line-2);border-radius:8px;background:var(--surface-1);color:var(--ink-1);padding:0 10px}
  .ctl::placeholder,.writer-filters input::placeholder{color:var(--ink-3);font-weight:400;opacity:1}
  .leaveout summary{list-style:none;cursor:pointer;display:flex;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .leaveout summary::-webkit-details-marker{display:none}
  .leaveout summary::after{content:"▾";margin-left:auto;padding-left:8px;color:var(--ink-3)}
  .leaveout .lo-box{position:absolute;z-index:5;top:40px;left:0;min-width:230px;background:var(--surface-1);border:1px solid var(--line-2);border-radius:8px;box-shadow:var(--shadow);padding:8px 10px}
  .leaveout .lo-box p{margin:6px 0 2px;font-size:var(--fs-xs);font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3)}
  .leaveout .lo-box label{display:flex;flex-direction:row;align-items:center;gap:8px;font-weight:400;font-size:var(--fs-s);color:var(--ink-1);min-height:36px;min-width:0;flex:none}
  .leaveout .lo-box input{width:18px;height:18px}
  .showall{margin:10px 0 0;font:inherit;font-size:var(--fs-s);border:1px solid var(--line-2);background:var(--surface-1);color:var(--accent);border-radius:8px;padding:9px 14px;cursor:pointer;min-height:44px}
  .showall:hover{border-color:var(--accent)}
  .writer-filters .lofield{display:flex;flex-direction:column;gap:6px;font-size:var(--fs-xs);font-weight:650;color:var(--ink-2);flex:1;min-width:150px}
  .riskcat{padding:12px 0;border-bottom:1px solid var(--line);font-size:var(--fs-s);color:var(--ink-2);scroll-margin-top:12px}
  .riskcat:focus{outline:none}
  .riskcat:target,.riskcat:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:4px}
  .riskcat h4{margin:0 0 4px;font-size:var(--fs-l);color:var(--ink-1)}
  .riskcat h4 .n{font-size:var(--fs-s);font-weight:400;color:var(--ink-2)}
  .riskcat h4 a.n{color:var(--accent);text-decoration:none}
  .riskcat h4 a.n:hover{text-decoration:underline}
  .riskcat p{margin:0 0 4px}
  .riskpage{max-width:68ch}
  .riskpage>.sect{margin-top:22px}
  .riskpage .body.small,.riskpage ul.risklist li,.riskpage .riskcat{font-size:var(--fs-s)}
  .riskcat b{color:var(--ink-1);font-weight:600}
  ul.carelevels li{display:grid;grid-template-columns:9.5em 1fr;gap:6px 12px;align-items:baseline}
  ul.carelevels .care{margin:0}
  ul.risklist li b{color:var(--ink-1)}
  /* ONE disclosure style for "show more text": accent, small, regular weight, a ▸/▾ marker. */
  details.more{margin-top:10px}
  details.more>summary{cursor:pointer;font-size:var(--fs-s);font-weight:400;color:var(--accent);min-height:32px;padding:6px 0;list-style:none;display:flex;align-items:center;gap:6px}
  details.more>summary::-webkit-details-marker{display:none}
  details.more>summary::before{content:"▸";font-size:var(--fs-xs);width:10px}
  details.more[open]>summary::before{content:"▾"}
  details.more>summary:hover{text-decoration:underline}
  details.more p{margin-top:4px}
  .body.small,p.small{font-size:var(--fs-s)}
  ul.usedin,ul.risklist{margin:0;padding:0;list-style:none}
  ul.usedin li,ul.risklist li{margin:0 0 8px;font-size:var(--fs-s);color:var(--ink-2)}
  ul.usedin a{font-weight:600;color:var(--ink-1)}
  .sublab{font-size:var(--fs-xs);color:var(--ink-3);margin:6px 0}
  .pagehead .eyebrow{margin:0 0 4px}
  /* list pages: tiers, grouped levers, stage nav, filters */
  .tier-start .rshelf{margin-bottom:6px;grid-template-columns:repeat(auto-fit,minmax(max(260px,calc((100% - 20px)/3)),1fr))}
  .mname .grade-badge{margin:0 0 0 6px;vertical-align:1px}
  .tiernote{color:var(--ink-2);font-size:var(--fs-s);margin:0 0 8px;max-width:70ch}
  .keepsafe{margin:14px 0 0;padding:10px 14px;border-left:3px solid var(--line-2);background:var(--surface-1);border-radius:0 8px 8px 0;font-size:var(--fs-s);color:var(--ink-2);line-height:1.9}
  .keepsafe .kslab{font-weight:650;color:var(--ink-1);margin-right:8px}
  .keepsafe a{color:var(--accent);text-decoration:none}
  .keepsafe a:hover{text-decoration:underline}
  .stagenav{margin:8px 0 0;font-size:var(--fs-s)}
  .stagenav a{color:var(--accent);text-decoration:none;display:inline-block;padding:6px 0}
  .stagenav a:hover{text-decoration:underline}
  .lgroup{margin:0 0 6px;border-top:1px solid var(--line)}
  /* List expanders are text, not boxes: they must not compete with the rows they extend. */
  #memberRows .capped .showall{margin:0 0 6px;min-height:36px;padding:6px 0;border:0;background:none;font-size:var(--fs-s)}
  #memberRows .capped .showall::before{content:"▸ ";font-size:var(--fs-xs)}
  #memberRows .capped .showall:hover{text-decoration:underline}
  .lghead{display:flex;align-items:baseline;gap:6px;padding:10px 0 2px}
  .lghead h3{margin:0;font-size:var(--fs-m);font-weight:650;color:var(--ink-1)}
  .lghead .n{color:var(--ink-2);font-size:var(--fs-s);font-variant-numeric:tabular-nums}
  .varies{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);font-weight:400;white-space:nowrap;vertical-align:1px}
  .varies::before{content:"";width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor;box-sizing:border-box}
  .rmeta{font-weight:400;color:var(--ink-3);font-size:var(--fs-s)}
  #memberRows .mrow{padding:7px 0}
  #memberRows .secthead{margin:22px 0 8px}
  details.structs{margin-top:22px}
  .listfilters{align-items:flex-end}
  .listfilters .ftext{flex:2;min-width:200px}
  .morefilters{flex:4;min-width:0}
  .morefilters>summary{display:none}
  .morefilters .mf-box{display:flex;flex-wrap:wrap;gap:16px;align-items:end}
  .morefilters .mf-box>label,.morefilters .mf-box>.lofield{flex:1;min-width:150px}
  /* home */
  .reye{font-size:var(--fs-xs);font-weight:650;letter-spacing:.04em;color:var(--accent)}
  ul.byp{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
  ul.byp li a{display:block;height:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-1);text-decoration:none}
  ul.byp li a:hover{border-color:var(--accent);background:var(--accent-soft)}
  ul.byp .sname{display:block;font-weight:600;font-size:var(--fs-s)}
  ul.byp .sone{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink-2);font-size:var(--fs-s);line-height:1.4;margin-top:2px}
  ul.byp li.byp-more{display:flex;align-items:center;padding:0 6px;font-size:var(--fs-s)}
  ul.byp li.byp-more a{border:0;background:none;padding:10px 0;color:var(--accent);height:auto}
  .writer-hero.searching .herop,.writer-hero.searching .sub{display:none}
  .writer-hero.searching{padding-top:20px;padding-bottom:18px;margin-bottom:12px}
  .writer-hero.searching h2{font-size:var(--fs-xl);margin:0}
  @media (hover:none),(max-width:640px){.kbdhint{display:none}}
  @media (min-width:960px){.tiles.goals{grid-template-columns:repeat(3,1fr)}}
  .noresult .nrlead{font-size:var(--fs-m);color:var(--ink-1);margin:14px 0 4px}
  .noresult .nrheads{margin:0 0 8px}

  .rows{display:flex;flex-direction:column}
  .mrow{
    display:block;padding:11px 0;border-bottom:1px solid var(--line);
    text-decoration:none;
  }
  /* ONE left edge: row text sits flush with the headings; the hover tint bleeds past it without moving it. */
  .mrow:hover{background:var(--accent-soft);box-shadow:-8px 0 0 var(--accent-soft),8px 0 0 var(--accent-soft)}
  .mrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  .mname{font-weight:600;font-size:var(--fs-m)}
  .mmech{
    color:var(--ink-2);font-size:var(--fs-s);margin:3px 0 0;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  /* Risk: ONE coloured element (the care word); every chip is a neutral pill. */
  .care{display:inline-flex;align-items:center;gap:5px;margin-left:8px;font-size:var(--fs-xs);font-weight:600;white-space:nowrap;vertical-align:1px}
  .care::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .care-low{color:var(--low)}.care-medium{color:var(--warn)}.care-high{color:var(--high)}
  .care-none{color:var(--ink-3);font-weight:400}
  .care-rec{color:var(--ink-2);font-weight:600}
  .care-rec::before{background:none;border:1.5px solid currentColor;box-sizing:border-box;border-radius:2px}
  .dotsep{color:var(--ink-3)}
  .care-none::before{background:none;border:1px solid currentColor;box-sizing:border-box}
  .gentler{display:inline-block;margin-left:6px;font-size:var(--fs-xs);color:var(--ink-2);font-style:italic}
  .riskblock .carehead{margin:0 0 8px;font-size:var(--fs-m)}
  .riskblock .carehead .care{margin-left:0;font-size:var(--fs-m)}
  .riskblock .carehead .care::before{width:9px;height:9px}
  .someforms{color:var(--ink-2);font-size:var(--fs-s)}
  .roleword{color:var(--ink-2);font-size:var(--fs-s)}
  /* Hanging labels: a wrapped chip sits under the first chip, never under its label. */
  .riskline{margin:0 0 6px;display:grid;grid-template-columns:max-content 1fr;gap:6px 12px;align-items:baseline}
  .riskline .rlab{font-size:var(--fs-s);color:var(--ink-2)}
  .riskline .rchips{display:flex;flex-wrap:wrap;gap:6px}
  .rolemark{margin:0 0 8px;font-size:var(--fs-s);color:var(--ink-2)}
  .rchip{font:inherit;font-size:var(--fs-s);line-height:1.3;white-space:nowrap;border:1px solid var(--line-2);background:var(--surface-1);color:var(--ink-1);border-radius:999px;padding:5px 12px;cursor:pointer;text-align:left;min-height:32px}
  .rchip.cond{border-style:dashed;border-color:var(--ink-3)}
  .rchip .sfx{color:var(--ink-2)}
  .rchip:hover{border-color:var(--ink-3)}

<script>

/* ============ theme ============ */
(function(){
  var KEY='of-theme', root=document.documentElement, btn=document.getElementById('themeToggle');

  established:['Established','The effect this explanation relies on is well replicated in research.'],
  supported:['Supported','The effect this explanation relies on has some direct research behind it.'],
  plausible:['Plausible','The explanation fits known psychology, but no study tests the effect it relies on.'],
  speculative:['Speculative','A reasonable guess with little evidence either way.'],

var GRADE_SCOPE='Grades rate the research behind the explanation, usually done outside hypnosis. They do not mean the move itself was tested in a hypnosis session.';
function renderGrades(view){
  var count={}; S.nodes.forEach(function(n){ if(n.evidence_grade) count[n.evidence_grade]=(count[n.evidence_grade]||0)+1; });

/* ============ risk: computed in the publisher, drawn by ONE renderer ============

function esc(s){

    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')

/* Slugs lose their hyphens for display, except in real compound words

var COMPOUND_PREFIX=/(^|-)(self|non|pre|post|co|anti|semi|quasi|counter|re)-(?=[a-z])/g;
var COMPOUND_WORDS=['one-way','two-way','count-up','count-down','follow-up','foot-in-the-door','door-in-the-face','step-by-step','so-called','eye-roll','real-time'];

  var t=String(kebab||'').split('-').map(function(w){return KEEP_CASE[w.toLowerCase()]||w;}).join('-').replace(COMPOUND_PREFIX,'$1$2\u0000');
  COMPOUND_WORDS.forEach(function(w){ t=t.split(w).join(w.replace(/-/g,'\u0000')); });

}
/* Prose with entry slugs ("false-bottom-depth-reframe (#329)", bare "yes-set" or "(#85)")
   turned into links. Only names that are real entries link; other hyphenated words stay text. */
function prose(text){
  return esc(text).replace(/\b([a-z0-9]+(?:-[a-z0-9]+)+)(\s*\(#(\d+)\))?|\(#(\d+)\)/g,function(m,slug,idPart,id1,id2){
    var n=(id1&&S.byId[+id1])||(slug&&S.byName[slug])||(id2&&S.byId[+id2]);
    return n?'<a href="#/entry/'+n.id+'">'+esc(n._title)+'</a>':m;
  });
}

function validateData(d){
  function require(ok){if(!ok){var error=new Error('This reference file is incomplete or incompatible with this viewer. Retry to fetch the current edition.');error.referenceData=true;throw error;}}
  function object(x){return x&&typeof x==='object'&&!Array.isArray(x);}
  function str(x){return x==null||typeof x==='string';}
  require(object(d)&&object(d.meta)&&d.meta.schema_version===3&&Array.isArray(d.nodes)&&d.nodes.length>0);
  require(Array.isArray(d.edges)&&Array.isArray(d.goals)&&Array.isArray(d.stages)&&Array.isArray(d.risk_categories));
  require(object(d.meta.annotation_coverage)&&Number.isInteger(d.meta.annotation_coverage.annotated_units)&&d.meta.annotation_coverage.annotated_units>=0);
  var cats=new Set();
  d.risk_categories.forEach(function(c){require(object(c)&&typeof c.slug==='string'&&(c.axis==='wrong'||c.axis==='hazard')&&['label','definition','could_go_wrong','mitigation'].every(function(k){return typeof c[k]==='string';})&&str(c.is_wrong));cats.add(c.slug);});
  var tags=new Set();
  d.goals.concat(d.stages).forEach(function(t){require(object(t)&&Number.isInteger(t.id)&&typeof t.name==='string'&&typeof t.label==='string'&&str(t.definition));tags.add(t.id);});
  var ids=new Set();
  d.nodes.forEach(function(n){
    require(object(n)&&Number.isInteger(n.id)&&n.id>0&&!ids.has(n.id)&&typeof n.name==='string'&&n.name.length>0&&typeof n.mech==='string');
    require(['technique','recipe','container','principle'].includes(n.kind)&&['scriptwriting_move','structural_pattern','supporting_principle','supporting_assessment'].includes(n.writer_role));
    require(['one_liner','why_short','principle_note','finding_name','finding_url','rr'].every(function(k){return str(n[k]);})&&(n.evidence_grade==null||!!GRADE[n.evidence_grade]));
    require(n.finding_url==null||/^https:\/\//.test(n.finding_url));
    require(n.risk==null||n.risk in CARE_RANK);
    require(n.care==null||n.care in CARE_RANK);
    require(n.role==null||n.role in ROLE);
    if(n.rk!=null){require(Array.isArray(n.rk)&&n.care in CARE_RANK);n.rk.forEach(function(c){require(Array.isArray(c)&&c.length===2&&cats.has(c[0])&&str(c[1]));});}
    require(Array.isArray(n.goals)&&Array.isArray(n.stages)&&n.goals.concat(n.stages).every(function(t){return tags.has(t);}));
    require(Number.isInteger(n.annotation_units)&&n.annotation_units>=0&&Number.isFinite(n.x)&&Number.isFinite(n.y));
    if(n.steps!=null){require(Array.isArray(n.steps));n.steps.forEach(function(s){require(Array.isArray(s)&&s.length===2&&(s[0]===null||Number.isInteger(s[0]))&&typeof s[1]==='string');});}
    if(n.ex!=null){require(Array.isArray(n.ex));n.ex.forEach(function(ex){require(object(ex)&&['f','t','s','m'].every(function(k){return str(ex[k]);}));});}
    ids.add(n.id);
  });
  d.nodes.forEach(function(n){
    (n.steps||[]).forEach(function(s){require(s[0]===null||ids.has(s[0]));});
    if(n.nb!=null){require(Array.isArray(n.nb));n.nb.forEach(function(p){require(Array.isArray(p)&&p.length===2&&ids.has(p[0])&&Number.isFinite(p[1]));});}
  });
  d.edges.forEach(function(e){require(object(e)&&ids.has(e.s)&&ids.has(e.t)&&['see_also','contrasts_with'].includes(e.k)&&str(e.n));});
  ['next','prev','cooc'].forEach(function(key){
    require(object(d[key]));
    Object.keys(d[key]).forEach(function(id){require(ids.has(+id)&&Array.isArray(d[key][id]));
      // next/prev: [other, count]; cooc: [other, count, lift]
      d[key][id].forEach(function(t){require(Array.isArray(t)&&t.length===(key==='cooc'?3:2)&&ids.has(t[0])&&Number.isInteger(t[1])&&t[1]>0&&(key!=='cooc'||(Number.isFinite(t[2])&&t[2]>=0)));});
    });
  });
}

function build(d){
  var i,n,e;
  // Rebuild derived indexes only after the complete public contract validates.
  S={ready:false,byId:{},byName:{},nodes:[],goals:[],stages:[],tagById:{},seeAlso:{},contrasts:{},usedIn:{},next:{},prev:{},cooc:{},annScripts:0,riskCats:[],riskCat:{}};
  S.meta=d.meta||{};
  S.rawEdges=d.edges||[];
  S.nodes=d.nodes||[];
  S.riskCats=d.risk_categories||[];
  S.riskCats.forEach(function(c){ S.riskCat[c.slug]=c; });
  [['goal',d.goals],['stage',d.stages]].forEach(function(pair){
    pair[1].forEach(function(t,ix){
      var tag={id:t.id,kind:pair[0],name:t.name,slug:t.name.replace(/^(goal|stage)-/,''),label:t.label,definition:t.definition||'',order:ix,members:[]};
      S.tagById[t.id]=tag; S[pair[0]+'s'].push(tag);
    });
  });
  for(i=0;i<S.nodes.length;i++){
    n=S.nodes[i];
    n._title=titleCase(n.name);
    S.byId[n.id]=n; S.byName[n.name]=n;
    n.goals.concat(n.stages).forEach(function(t){S.tagById[t].members.push(n);});
  }
  S.nodes.forEach(function(r){
    (r.steps||[]).forEach(function(st,ix){ if(st[0]!=null)(S.usedIn[st[0]]||(S.usedIn[st[0]]=[])).push({recipe:r.id,step:ix+1,text:st[1]}); });
  });
  S.recipes=S.nodes.filter(function(x){return x.kind==='recipe';}).sort(byStarter);

  var edges=d.edges||[];
  for(i=0;i<edges.length;i++){
    e=edges[i];
    if(!S.byId[e.s]||!S.byId[e.t]) continue;
    if(e.k==='see_also'){ addEdge(S.seeAlso,e.s,e.t); addEdge(S.seeAlso,e.t,e.s); }
    else if(e.k==='contrasts_with'){ addEdge(S.contrasts,e.s,e.t); addEdge(S.contrasts,e.t,e.s); }
  }
  Object.keys(S.seeAlso).forEach(function(k){ S.seeAlso[k].sort(byOtherName); });
  Object.keys(S.contrasts).forEach(function(k){ S.contrasts[k].sort(byOtherName); });

  /* sequence layers: next/prev = {id:[[other,count]...]}, cooc = {a:[[b,count,lift]...]} */
  S.next=d.next||{}; S.cooc=d.cooc||{}; S.prev=d.prev||{};
  S.annScripts=(S.meta.annotation_coverage||{}).annotated_units||0;
  if(window.Writer) Writer.restore();

  S.ready=true;
  document.title=SITE;
}
function byName(a,b){ return a.name<b.name?-1:a.name>b.name?1:0; }
function bySeen(a,b){ return (b.annotation_units-a.annotation_units)||byName(a,b); }
/* ONE ordering rule for every list (goal, stage, recipes, home shelf; search uses it to break
   ties): recognition-only last, gentlest core care first, safeguards before other roles, a
   recipe that needs an earlier install after one that does not, a lever that is a step in one of
   this page's recipes, then the moves writers actually use, then name. */
function stepSet(members){ var s={}; members.forEach(function(r){ if(r.kind==='recipe') (r.steps||[]).forEach(function(st){ if(st[0]!=null) s[st[0]]=1; }); }); return s; }
function listOrder(steps){
  steps=steps||{};
  return function(a,b){
    return ((a.role==='recognition')-(b.role==='recognition'))||(careRank(a)-careRank(b))||((b.role==='safeguard')-(a.role==='safeguard'))||
      ((prerequisite(a)?1:0)-(prerequisite(b)?1:0))||((steps[b.id]?1:0)-(steps[a.id]?1:0))||(b.annotation_units-a.annotation_units)||byName(a,b);
  };
}
var byStarter=listOrder();
/* The prerequisite and starter rules live in writer-tools.js with the search that uses them. */
function prerequisite(n){ return Writer.prerequisite(n); }
function isStarter(n){ return Writer.isStarter(n); }
function mindControlIds(){ return S.goals.filter(function(t){return t.slug==='mind-control';}).map(function(t){return t.id;}); }
/* Where to install one first: install-stage trigger entries, recipes then gentler then most seen. */
function installLinks(n){
  var trig=S.goals.filter(function(t){return t.slug==='triggers';})[0], inst=S.stages.filter(function(t){return t.slug==='install';})[0];
  if(!trig||!inst) return [];
  return trig.members.filter(function(x){return x.id!==n.id&&x.stages.indexOf(inst.id)>=0&&/(trigger|cue|anchor).*(install|condition)|(install|condition).*(trigger|cue|anchor)/.test(x.name)&&!prerequisite(x);})
    .sort(function(a,b){return ((a.kind==='recipe'?0:1)-(b.kind==='recipe'?0:1))||(careRank(a)-careRank(b))||bySeen(a,b);}).slice(0,2);

/* Variations: other recipes that use this one as a step (or are used by it), share two
   levers, or share a lever AND a goal. Most shared first, at most six. Backfills "Similar". */
function relatedRecipes(n){
  if(n.kind!=='recipe') return [];
  var mine={}; (n.steps||[]).forEach(function(s){ if(s[0]!=null) mine[s[0]]=true; });
  var out=[];
  S.recipes.forEach(function(r){
    if(r.id===n.id) return;
    var shared=0, usesMe=!!mine[r.id];
    (r.steps||[]).forEach(function(s){ if(s[0]===n.id) usesMe=true; if(s[0]!=null&&mine[s[0]]) shared++; });
    var sameGoal=r.goals.some(function(g){return n.goals.indexOf(g)>=0;});
    if(usesMe||shared>=2||(shared>=1&&sameGoal)) out.push([r,(usesMe?10:0)+shared]);
  });
  return out.sort(function(a,b){return (b[1]-a[1])||bySeen(a[0],b[0]);}).slice(0,6).map(function(x){return x[0];});
}
function byOtherName(a,b){ var x=S.byId[a.o].name,y=S.byId[b.o].name; return x<y?-1:x>y?1:0; }
function addEdge(map,from,to){
  var arr=map[from]||(map[from]=[]);
  for(var i=0;i<arr.length;i++) if(arr[i].o===to) return;
  arr.push({o:to});
}

function parseHash(){

    raw.slice(qi+1).split('&').forEach(function(kv){ var p=kv.split('='); if(p[0]) query[decodeURIComponent(p[0])]=decodeURIComponent(p[1]||''); });

}

function findTag(kind,slug){
  var list=kind==='goal'?S.goals:S.stages;
  for(var i=0;i<list.length;i++) if(list[i].slug===slug) return list[i];
  return null;
}

/* ============ home ============ */
/* Before you play: the five safeguards a newcomer should know first. A pick by use would miss
   the safeword (Stop signal is not in the top 12 by use), so this is a named list; check.cjs
   fails if a merge drops one. */
var BEFORE_YOU_PLAY=['stop-signal','preloaded-exit-cue','consent-checkpoint','trigger-expiry-clause','aftercare'];
function renderLanding(view){
  view.innerHTML=
    '<section class="writer-hero" id="hero"><h2>Hypnosis, taken apart.</h2><p class="herop">An encyclopedia of hypnosis techniques: what each one does, how to do it, and why it works, with <a href="#/grades">an honest grade</a> for how sure anyone can be. '+LEVER_GLOSS+'</p>'+
    '<p class="sub"><b>'+S.nodes.length+'</b> entries · <b>'+S.recipes.length+'</b> recipes · <b>'+S.goals.length+'</b> goals · <b>'+S.stages.length+'</b> session stages</p>'+
    '<div class="searchwrap">'+
      '<input id="q" type="search" autocomplete="off" spellcheck="false" '+
        'placeholder="Search '+S.nodes.length+' entries'+(window.matchMedia&&matchMedia(NARROW).matches?'':': safe word, fractionation, triggers…')+'" '+
        'value="'+esc(searchQuery)+'" aria-label="Search entries">'+
      '<p class="hint kbdhint"><kbd>/</kbd> search &nbsp; <kbd>Esc</kbd> up a level &nbsp; <kbd>←→↑↓</kbd> move between rows</p>'+
    '</div></section>'+
    '<div id="results"></div>';
  var q=document.getElementById('q');
  q.addEventListener('input',function(){
    searchQuery=q.value;
    // Shareable: the query lives in the URL without adding a history step per keystroke.
    history.replaceState(null,'','#/'+(q.value.trim()?'?q='+encodeURIComponent(q.value.trim()):''));
    renderResults();
  });
  renderResults();
}
/* One starter per stage: the first starter recipe that STARTS at that stage (the same filing as
   #/recipes), by the list order, or the stage's most-used Standard-care safeguard when no recipe
   starts there. Never a prerequisite recipe, never Edge play (isStarter rules out both). */
function firstSession(){
  var out=[], used={};
  S.stages.forEach(function(t,i){
    var r=t.members.filter(function(n){return isStarter(n)&&!used[n.id]&&firstStage(n)===t;}).sort(listOrder(stepSet(t.members)))[0]||
          t.members.filter(function(n){return n.kind==='technique'&&n.role==='safeguard'&&n.care==='low'&&!used[n.id];}).sort(bySeen)[0];
    if(r){ used[r.id]=1; out.push({stage:t,num:i,n:r}); }
  });
  return out;
}

/* One count format everywhere a goal or stage is summarised (home tile = page head). */
function kindCounts(members,short){
  var c={recipe:0,technique:0,other:0};
  members.forEach(function(n){ c[n.kind==='recipe'||n.kind==='technique'?n.kind:'other']++; });
  return plural(c.recipe,'recipe','recipes')+' · '+plural(c.technique,'lever','levers')+
    (c.other&&!short?' · '+plural(c.other,'session structure or principle','session structures and principles'):'');
}
/* A goal's definition opens by naming the goal ("Triggers and automatic responses: …"); where the
   label is already the heading, that part goes ("Automatic responses: …"). */
function tagDef(t){
  var d=t.definition||'', i=d.indexOf(':'); if(t.kind!=='goal'||i<0) return d;
  var norm=function(x){return x.toLowerCase().replace(/[^a-z]+/g,' ').trim();};
  var head=d.slice(0,i), L=norm(t.label), parts=head.split(/,\s*|\s+and\s+/);
  if(norm(head).indexOf(L)<0) return d;
  var keep=parts.filter(function(p){return norm(p)!==L;}), rest=d.slice(i+1).trim();
  // "Orgasm and pleasure control" keeps "Orgasm"; "Trance skills" alone leaves the list.
  var out=keep.length?keep.join(keep.length>2?', ':' and ')+': '+rest:rest;
  if(keep.length===parts.length) return d;
  return out.charAt(0).toUpperCase()+out.slice(1);
}
function tagTile(t,num){
  return '<a class="tile knav" href="'+tagHref(t)+'">'+
    '<span class="tname">'+(num?'<span class="tnum">'+num+'</span>':'')+esc(t.label)+'</span>'+
    '<span class="tdef">'+esc(tagDef(t))+'</span>'+
    '<span class="tcnt">'+kindCounts(t.members,true)+'</span></a>';
}
function recipeCard(n,eyebrow){
  return '<a class="rcard knav" href="#/entry/'+n.id+'">'+(eyebrow?'<span class="reye">'+eyebrow+'</span>':'')+'<span class="rname">'+esc(n._title)+'</span>'+
    '<span class="rone">'+esc(n.one_liner||n.mech)+'</span>'+
    '<span class="rcnt">'+careMark(n)+(n.kind==='recipe'?plural((n.steps||[]).length,'step','steps'):n.role==='safeguard'?'Safeguard':esc(KIND_LABEL[n.kind]||''))+'</span></a>';
}
function matchesText(n){ return n===1?'1 match':n+' matches'; }

function renderResults(){
  var box=document.getElementById('results');
  if(!box) return;
  var q=searchQuery.trim();
  var hero=document.getElementById('hero'); if(hero) hero.classList.toggle('searching',!!q);
  var html='', hits=[];
  if(!q){
    var shelf=firstSession(), onShelf={};
    shelf.forEach(function(s){ onShelf[s.n.id]=1; });
    var byp=BEFORE_YOU_PLAY.map(function(nm){return S.byName[nm];}).filter(function(n){return n&&!onShelf[n.id];});
    html+='<div class="secthead wrapn"><h2>Before you play</h2><span class="n">the safeguards to know first</span></div>';
    html+='<ul class="byp">'+byp.map(function(n){return '<li><a class="knav" href="#/entry/'+n.id+'"><span class="sname">'+esc(n._title)+'</span><span class="sone">'+esc(n.one_liner||'')+'</span></a></li>';}).join('')+
      '<li class="byp-more"><a href="#/risk">What the risk labels mean →</a></li></ul>';
    html+='<div class="secthead wrapn"><h2>One starter for each stage</h2><span class="n">in session order · <a href="#/recipes">all '+S.recipes.length+' recipes →</a></span></div>';
    html+='<div class="rshelf">'+shelf.map(function(s){return recipeCard(s.n,'<span class="tnum">'+(s.num+1)+'</span> '+esc(s.stage.label));}).join('')+'</div>';
    html+='<div class="secthead"><h2>What are you training?</h2><span class="n">'+S.goals.length+' goals</span></div>';
    html+='<div class="tiles goals">'+S.goals.map(function(t){return tagTile(t);}).join('')+'</div>';
    html+='<div class="secthead"><h2>Where in the session?</h2><span class="n">'+S.stages.length+' stages, in order</span></div>';
    html+='<div class="tiles stages">'+S.stages.map(function(t,i){return tagTile(t,i+1);}).join('')+'</div>';
  }else{
    var nq=Writer.clean(Writer.norm(q)), alts=Writer.expand(nq);
    var whole=function(s,t){return (' '+s+' ').indexOf(' '+t+' ')>=0;};
    // Tiles match whole words of the label (or a synonym of the query), or of a goal's own
    // definition: its head before the colon, stemmed ("brainwashing" → Mind control), and its
    // example list after it ("doll, pet, blank…" → Identity). Exact label leads.
    var tags=S.goals.concat(S.stages).filter(function(t){ var ci=t.definition.indexOf(':'), hd=ci>=0?Writer.norm(t.definition.slice(0,ci)):'';
      var L=Writer.norm(t.label)+(t.kind==='goal'&&ci>=0?' '+hd+' '+hd.split(' ').map(Writer.stem).join(' ')+' '+Writer.norm(t.definition.slice(ci+1)):'');
      return alts.some(function(a){ return a.words.length&&a.words.every(function(w){return whole(L,w)||whole(L,Writer.stem(w));}); }); })
      .sort(function(a,b){ return (Writer.norm(b.label)===nq)-(Writer.norm(a.label)===nq); });
    hits=Writer.search(q);
    // The definition is a fallback only when nothing else answers the query.
    if(!tags.length&&!hits.length) tags=S.goals.concat(S.stages).filter(function(t){ var D=Writer.norm(t.definition); return nq.split(' ').every(function(w){return whole(D,w)||whole(D,Writer.stem(w));}); });
    if(tags.length) html+='<div class="secthead"><h2>Goals and stages</h2><span class="n">'+matchesText(tags.length)+'</span></div><div class="tiles">'+tags.map(function(t){return tagTile(t);}).join('')+'</div>';
    // A safety question ("is it safe", "safe word") leads with the five named safeguards a
    // newcomer needs, under their own heading, whatever their use counts; the ranked list follows.
    if(Writer.safetyQuery(nq)){
      var byp=BEFORE_YOU_PLAY.map(function(nm){return S.byName[nm];}).filter(Boolean), inByp={};
      byp.forEach(function(n){ inByp[n.id]=1; });
      html+='<div class="secthead"><h2>Safeguards to know first</h2></div><div class="rows">'+byp.map(function(n){return entryRow(n,{kind:true});}).join('')+'</div>';
      hits=hits.filter(function(n){return !inByp[n.id];});
    }
    var CAP=60, shown=hits.slice(0,CAP);
    if(hits.length){
      html+='<div class="secthead"><h2>'+(Writer.safetyQuery(nq)?'More entries':'Entries')+'</h2><span class="n">'+matchesText(hits.length)+
        (hits.length>CAP?' · best '+CAP+' shown · <a href="#/table?q='+encodeURIComponent(q)+'">see all '+hits.length+'</a>':'')+'</span></div>';
      html+='<div class="rows">'+shown.map(function(n){return entryRow(n,{kind:true});}).join('')+'</div>';
    }else if(!tags.length){
      var heads=Writer.synonymHeads(q);
      html+='<div class="noresult"><p class="nrlead">Nothing is called “'+esc(q)+'”.'+(heads.length?' Try:':'')+'</p>'+
        (heads.length?'<p class="nrheads">'+heads.map(function(h){return '<button type="button" class="linkbtn" data-q="'+esc(h)+'">'+esc(h)+'</button>';}).join(' · ')+'</p>':'')+
        '<div class="secthead"><h2>A starting point</h2><span class="n">'+matchesText(0)+' for your words</span></div>'+
        '<div class="rshelf">'+S.recipes.filter(isStarter).slice(0,3).map(function(n){return recipeCard(n);}).join('')+'</div>'+
        '<div class="secthead"><h2>Or browse by session stage</h2></div><div class="tiles stages">'+S.stages.map(function(t,i){return tagTile(t,i+1);}).join('')+'</div></div>';
    }
  }
  box.innerHTML=html;
  box.querySelectorAll('[data-q]').forEach(function(b){ b.addEventListener('click',function(){ var inp=document.getElementById('q'); inp.value=b.getAttribute('data-q'); inp.dispatchEvent(new Event('input')); inp.focus(); }); });
  if(q) document.getElementById('writerStatus').textContent=matchesText(hits.length)+'.';
}

/* Unmarked = Standard care: the care word shows only where it is NOT standard (or the entry is
   recognition-only), on every list row, card, table row, search row, Similar row and ego row alike.
   ".varies" = the plain form carries this care, but some forms need more (n.risk > n.care): said in
   words, in the higher level's colour, with a hollow dot (hollow = not every form), so touch readers see it too. */
var SOME_SHORT={medium:'Negotiate',high:'Edge play'};
function someForms(n){ return n.role!=='recognition'&&CARE_RANK[n.risk]>CARE_RANK[n.care]?'<span class="varies care-'+n.risk+'" title="Some forms: '+CARE[n.risk]+'">'+SOME_SHORT[n.risk]+' in some forms</span>':''; }
function careMark(n){
  var big=n.role==='recognition'||careOf(n)!=='low', sf=someForms(n), sep='<span class="dotsep"> · </span>';
  return (big?careBadge(n).trim():'')+(big&&sf?sep:'')+sf+(big||sf?sep:'');
}
var LEGEND='Unmarked = Standard care';
function legendP(){ return '<p class="risklegend">'+LEGEND+' · <a href="#/risk">What the risk labels mean →</a></p>'; }
function entryRow(n,o){
  o=o||{};
  // Kind is never a pill: in lists only recipes say anything, as "N steps". On #/recipes the
  // install it needs and the muted word "Starter" join it.
  var rm=(o.recipe||o.kind)&&n.kind==='recipe'?'<span class="rmeta"> · '+plural((n.steps||[]).length,'step','steps')+(o.recipe&&prerequisite(n)?' · needs an installed trigger':'')+(o.recipe&&isStarter(n)?' · Starter':'')+'</span>':'';
  return '<a class="mrow knav" href="#/entry/'+n.id+'">'+
    '<div class="mname">'+esc(n._title)+rm+(o.grade&&n.evidence_grade?' '+gradePill(n.evidence_grade):'')+'</div>'+
    '<p class="mmech">'+careMark(n)+esc(n.one_liner||n.mech||'')+'</p>'+
  '</a>';
}

/* ============ goal / stage / recipes pages: ONE list model ============
   memberModel() answers "where do I start", "how do I keep it safe" and "what is this made
   of", in that order; every entry gets the first tier it qualifies for and no later one. The
   renderer only changes the shape. Any filter or text drops the tiers for one flat list. */
function firstStage(n){ return n.stages.length?S.tagById[n.stages[0]]:null; }
function firstGoal(n){ return n.goals.length?S.tagById[n.goals[0]]:null; }
function topSafeguards(stageIds,skip,max){
  var lists=stageIds.map(function(id){ return S.nodes.filter(function(n){return n.role==='safeguard'&&n.care==='low'&&n.kind==='technique'&&n.stages.indexOf(id)>=0;}).sort(bySeen); });
  lists.push(S.nodes.filter(function(n){return n.role==='safeguard'&&n.care==='low'&&n.kind==='technique';}).sort(bySeen));
  var out=[], seen=Object.assign({},skip);
  // Interleave the stages, so the second stage still gets a link; the global list backfills.
  for(var i=0;out.length<max&&i<40;i++) lists.forEach(function(l){ var n=l[i]; if(n&&!seen[n.id]&&out.length<max&&(l!==lists[lists.length-1]||out.length<2)){ seen[n.id]=1; out.push(n); } });
  return out;
}
function memberModel(members,page){
  var steps=stepSet(members), ord=listOrder(steps), placed={};
  var sorted=members.slice().sort(ord);
  function take(list){ var out=list.filter(function(n){return !placed[n.id];}); out.forEach(function(n){placed[n.id]=1;}); return out; }
  function grouped(list,keyOf,order,anyLabel,otherLabel,cap){
    var by={}, groups=[];
    list.forEach(function(n){ var t=keyOf(n), k=t?t.id:'any'; (by[k]||(by[k]=[])).push(n); });
    order.forEach(function(t){ if(by[t.id]) groups.push({key:t.kind+'-'+t.slug,label:t.label,rows:by[t.id],cap:cap}); });
    if(by.any) groups.push({key:'any',label:anyLabel,rows:by.any,cap:cap});
    if(!otherLabel) return groups;
    // Groups of fewer than 4 merge into one "Other" group, still in list order.
    var small=groups.filter(function(g){return g.rows.length<4;});
    if(small.length<2) return groups;
    var other={key:'other',label:otherLabel,rows:[].concat.apply([],small.map(function(g){return g.rows;})).sort(ord),cap:cap};
    return groups.filter(function(g){return g.rows.length>=4;}).concat([other]);
  }
  var m={kind:page.kind,start:[],startLevers:[],startNote:'',startTitle:'Start here',safe:[],safeGroup:[],how:[],recipes:[],prereq:[],groups:[],structures:[]};
  if(page.kind==='recipes'){
    // A session skeleton: by first stage, starters first inside each, then the list order.
    var rs=sorted.filter(function(n){return n.kind==='recipe';});
    rs=rs.filter(isStarter).concat(rs.filter(function(n){return !isStarter(n);}));
    m.groups=grouped(take(rs),firstStage,S.stages,'No stage',null,8);
    m.groups.forEach(function(g){ g.opts={recipe:true}; });
    return m;
  }
  var recipes=sorted.filter(function(n){return n.kind==='recipe';});
  m.start=take(recipes.filter(isStarter).slice(0,3));
  var used={}; m.start.forEach(function(r){ (r.steps||[]).forEach(function(s){ if(s[0]!=null) used[s[0]]=1; }); });
  var levers=sorted.filter(function(n){return n.kind==='technique'&&n.role!=='recognition';});
  // Step levers a newcomer can try alone: Standard care, and not one that fires an earlier install.
  if(m.start.length) m.startLevers=take(levers.filter(function(n){return used[n.id]&&n.care==='low'&&Writer.NEEDS_INSTALL_LEVERS.indexOf(n.name)<0;}).sort(bySeen).slice(0,2));
  else if(page.kind==='goal'){
    // No starter: say only what is true, and offer the levers that are gentle in every form
    // (worst-case risk, not core care), so the block never contradicts the care badges below.
    m.startTitle='Gentlest ways in';
    m.startNote='None of these recipes is a first-timer’s routine.';
    m.startLevers=take(levers.slice().sort(function(a,b){return (riskRank(a)-riskRank(b))||bySeen(a,b);}).slice(0,2));
  }else if(!members.some(function(n){return n.role==='safeguard';})){
    m.startNote='No recipe begins at this stage.';
  }
  // (A stage with no starter but with safeguards opens on its Safeguards group instead.)
  if(page.kind==='goal'){
    // The goal's own safeguards, then the most-used ones from its two biggest first stages.
    var cnt={}; sorted.forEach(function(n){ var f=n.kind==='technique'&&firstStage(n); if(f) cnt[f.id]=(cnt[f.id]||0)+1; });
    var top=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];}).slice(0,2).map(Number);
    // The goal's own two strongest safeguards, then the plain-named ones a newcomer can parse
    // (BEFORE_YOU_PLAY), then the most-used from its biggest stages if still short.
    var own=take(sorted.filter(function(n){return n.role==='safeguard';}).slice(0,2));
    var skip={}; own.forEach(function(n){skip[n.id]=1;}); Object.keys(placed).forEach(function(k){skip[k]=1;});
    var byp=BEFORE_YOU_PLAY.map(function(nm){return S.byName[nm];}).filter(function(n){return n&&!skip[n.id];}).slice(0,4-own.length);
    byp.forEach(function(n){skip[n.id]=1;});
    m.safe=own.concat(byp,topSafeguards(top,skip,Math.max(0,4-own.length-byp.length)));
    m.safe.forEach(function(n){placed[n.id]=1;});
    // A safeguard principle is a way to keep it safe, not an explanation: it joins that line.
    m.safe=m.safe.concat(take(sorted.filter(function(n){return n.kind==='principle'&&n.role==='safeguard';})));
  }else{
    m.safeGroup=take(sorted.filter(function(n){return n.role==='safeguard';}).sort(function(a,b){return (careRank(a)-careRank(b))||bySeen(a,b);}));
    if(!m.safeGroup.length) m.safe=topSafeguards([page.tag.id],placed,3);
  }
  var gi=function(n){ var i=GRADE_ORDER.indexOf(n.evidence_grade); return i<0?GRADE_ORDER.length:i; };
  m.how=take(sorted.filter(function(n){return n.kind==='principle'&&n.role!=='safeguard';}).sort(function(a,b){return (gi(a)-gi(b))||(b.annotation_units-a.annotation_units)||byName(a,b);}));
  if(page.kind!=='goal') m.how=m.how.concat(take(sorted.filter(function(n){return n.kind==='principle';})));
  var rest=sorted.filter(function(n){return n.kind==='recipe';});
  m.recipes=take(rest.filter(function(n){return !prerequisite(n);}));
  m.prereq=take(rest);
  m.structures=take(sorted.filter(function(n){return n.kind==='container';}));
  var lv=take(sorted);
  m.groups=page.kind==='goal'?grouped(lv,firstStage,S.stages,'No stage','Other stages',CAP):grouped(lv,firstGoal,S.goals,'Any goal','Other goals',CAP);
  return m;
}
/* A capped list: the expander sits UNDER its rows (DOM order = visual order = Tab order) and only
   exists when it hides 2 or more rows: a button that reveals one row costs more than the row. */
var CAP=3;
function capped(key,list,cap,label,opts){
  var all=groupOpen[key]||list.length<=cap+1, shown=all?list:list.slice(0,cap);
  var btn=all?'':'<button type="button" class="showall" data-group="'+esc(key)+'">'+esc(label)+'</button>';
  return '<div class="capped" data-cap="'+esc(key)+'"><div class="rows">'+shown.map(function(n){return entryRow(n,opts);}).join('')+'</div>'+btn+'</div>';
}
/* A lever / recipe group: "Install · 74", its first rows, then "All 74 in Install". */
function groupHTML(g){
  return '<section class="lgroup" data-key="'+esc(g.key)+'"><div class="lghead"><h3 class="gl">'+esc(g.label)+'</h3><span class="n">· '+g.rows.length+'</span></div>'+
    capped(g.key,g.rows,g.cap,'All '+g.rows.length+' in '+g.label,g.opts)+'</section>';
}
function keepSafe(list,lead){
  if(!list.length) return '';
  return '<p class="keepsafe"><span class="kslab">'+lead+'</span>'+list.map(function(n){return '<a class="knav" href="#/entry/'+n.id+'">'+esc(n._title)+'</a>';}).join('<span class="dotsep"> · </span>')+'</p>';
}
function modelHTML(m){
  var h='', n;
  if(m.kind==='recipes') return m.groups.map(groupHTML).join('');
  if(m.start.length||m.startLevers.length||m.startNote){
    h+='<section class="tier tier-start"><div class="secthead"><h2>'+esc(m.startTitle)+'</h2></div>';
    if(m.startNote) h+='<p class="tiernote">'+esc(m.startNote)+'</p>';
    if(m.start.length) h+='<div class="rshelf">'+m.start.map(function(r){return recipeCard(r);}).join('')+'</div>';
    if(m.startLevers.length) h+='<div class="rows">'+m.startLevers.map(function(x){return entryRow(x);}).join('')+'</div>';
    h+='</section>';
  }
  if(m.safeGroup.length) h+='<div class="secthead"><h2>Safeguards</h2><span class="n">'+m.safeGroup.length+'</span></div>'+capped('safeguards',m.safeGroup,CAP,'All '+m.safeGroup.length+' safeguards');
  h+=keepSafe(m.safe,'Keep it safe:');
  if(m.how.length) h+='<div class="secthead"><h2>How it works</h2><span class="n">'+plural(m.how.length,'principle','principles')+'</span></div>'+capped('how',m.how,CAP,'All '+m.how.length+' principles',{grade:true});
  n=m.recipes.length+m.prereq.length;
  var rb='';
  if(m.recipes.length) rb+=capped('recipes',m.recipes,CAP,'All '+m.recipes.length+' recipes');
  // The second kind of recipe is its own group, so the expander above plainly belongs to the first.
  if(m.prereq.length) rb+=groupHTML({key:'prereq',label:'Once a trigger is installed',rows:m.prereq,cap:CAP});
  // Every recipe here is Edge play (Emerge): name that and keep the list closed, so the page
  // still reads "safe version first".
  var edgeOnly=n&&m.recipes.concat(m.prereq).every(function(r){return r.care==='high';});
  if(edgeOnly) h+='<details class="more structs" data-key="recipes-edge"'+(groupOpen['open:recipes-edge']?' open':'')+'><summary>Recipes ('+n+', all Edge play)</summary>'+rb+'</details>';
  else if(n) h+='<div class="secthead"><h2>'+(m.start.length?'More recipes':'Recipes')+'</h2><span class="n">'+n+'</span></div>'+rb;
  if(m.groups.length){
    var total=m.groups.reduce(function(s,g){return s+g.rows.length;},0);
    h+='<div class="secthead"><h2>'+(m.start.length||m.safeGroup.length||m.startLevers.length?'More levers':'Levers')+', by '+(m.kind==='goal'?'stage':'goal')+'</h2><span class="n">'+total+'</span></div>'+m.groups.map(groupHTML).join('');
  }

/* ============ entry view ============ */
function sect(label,body,cls){ return '<section class="sect'+(cls?' '+cls:'')+'"><h3 class="lab">'+label+'</h3>'+body+'</section>'; }
function simRow(o,base,extra){
  var gentler=base&&base.role!=='recognition'&&o.role!=='recognition'&&careRank(o)<careRank(base);
  return '<li><a class="knav" href="#/entry/'+o.id+'"><span class="sname">'+esc(o._title)+'</span>'+
    (gentler?'<span class="gentler">gentler</span>':'')+(extra||'')+
    '<span class="sone">'+careMark(o)+esc(o.one_liner||o.mech||'')+'</span></a></li>';
}
/* Everything the entry page already links in its head and body: the entry, its step levers,
   the "Before you start" install links, the recipes that use it and its look-alikes. The tail
   and the ego panel both exclude these, so the two agree and nothing shows twice. */
function entryOnPage(n){
  var on={}; on[n.id]=1;
  (n.steps||[]).forEach(function(s){ if(s[0]!=null) on[s[0]]=1; });
  if(prerequisite(n)) installLinks(n).forEach(function(x){ on[x.id]=1; });
  (S.usedIn[n.id]||[]).forEach(function(u){ on[u.recipe]=1; });
  (S.contrasts[n.id]||[]).forEach(function(r){ on[r.o]=1; });
  return on;
}
/* ONE "Similar", split by weight: "Same job, other ways" (care no heavier than this entry, the
   closest gentler one first) and "Heavier variants" (never on a safeguard's page). Embedding
   neighbours first, then curated see-also and recipe variations. */
function similarEntries(n,exclude){
  var seen=Object.assign({},exclude), pool=[]; seen[n.id]=1;
  (n.nb||[]).map(function(p){return S.byId[p[0]];}).concat((S.seeAlso[n.id]||[]).map(function(r){return S.byId[r.o];}),relatedRecipes(n))
    .forEach(function(o){ if(o&&!seen[o.id]){ seen[o.id]=1; pool.push(o); } });
  var rec=n.role==='recognition', base=careRank(n);
  function heavy(o){ return !rec&&(o.role==='recognition'||careRank(o)>base); }
  var same=pool.filter(function(o){return !heavy(o);});
  if(!rec&&base>0){
    var g=same.filter(function(o){return o.role!=='recognition'&&careRank(o)<base;})[0];
    if(g) same=[g].concat(same.filter(function(o){return o!==g;}));
  }
  // A safeguard's "same job" is other safeguards first, then principles, then other moves.
  if(n.role==='safeguard'){ var rk=function(o){return o.role==='safeguard'?0:o.kind==='principle'?1:2;}; same=same.map(function(o,i){return [o,i];}).sort(function(a,b){return (rk(a[0])-rk(b[0]))||(a[1]-b[1]);}).map(function(x){return x[0];}); }
  return {same:same.slice(0,4),heavier:n.role==='safeguard'?[]:pool.filter(heavy).slice(0,3)};
}
/* "Variations:" in the how-to becomes a list; the head stays prose. When the how-to opens by
   restating the one-liner's first clause (the lead already says it), that sentence is dropped
   from the view (the data keeps it). */
function firstClause(t){ return Writer.norm(String(t||'').split(/[,.;:]/)[0]); }
function restates(n){ var c=firstClause(n.one_liner); return c.length>=12&&Writer.norm(n.mech).indexOf(c)===0; }
function mechBody(n){
  var mech=n.mech||'';
  if(restates(n)){ var m=/^[\s\S]*?[.!?](\s+|$)/.exec(mech); mech=m?mech.slice(m[0].length):''; }
  return mech.trim();
}
function mechHTML(mech){
  var i=mech.indexOf('Variations:');
  if(i<0) return mech?'<p class="body">'+prose(mech)+'</p>':'';
  var head=mech.slice(0,i).trim(), items=mech.slice(i+11).split(/;\s+/).map(function(x){return x.trim().replace(/\.$/,'');}).filter(Boolean);
  return (head?'<p class="body">'+prose(head)+'</p>':'')+(items.length?'<p class="sublab">Ways to vary it</p><ul class="variations">'+items.map(function(x){return '<li>'+prose(x.charAt(0).toUpperCase()+x.slice(1))+'</li>';}).join('')+'</ul>':'');
}
function seenText(n){ return n.annotation_units?'Seen in '+n.annotation_units+' of '+S.annScripts+' scripts':''; }
function gradePill(g,link){
  if(!GRADE[g]) return '';
  return link?'<a class="grade-badge g-'+esc(g)+'" href="#/grades#'+esc(g)+'" title="'+esc(GRADE[g][1])+'">'+GRADE[g][0]+'</a>':'<span class="grade-badge g-'+esc(g)+'" title="'+esc(GRADE[g][1])+'">'+GRADE[g][0]+'</span>';
}
function renderEntry(view,n){
  var home=n.kind==='recipe'?['#/recipes','Recipes']:(n.stages.length?[tagHref(S.tagById[n.stages[0]]),S.tagById[n.stages[0]].label]:null);
  var html=crumbs(home?[['#/','Home'],home]:[['#/','Home']],n._title)+'<article class="entry">';
  var dot='<span class="dotsep"> · </span>';
  // Kind is text in the eyebrow, never a pill; the grade is the only pill in the head.
  // Goals, then stages after "in", so a goal never reads as a stage: "Recipe · Triggers, Obedience · in Install, Make it stick".
  var tagA=function(id){var t=S.tagById[id];return '<a href="'+tagHref(t)+'">'+esc(t.label)+'</a>';};
  html+='<p class="kindline">'+esc(KIND_LABEL[n.kind]||n.kind)+(n.goals.length?dot+n.goals.map(tagA).join(', '):'')+(n.stages.length?dot+'<span class="kin">in</span> '+n.stages.map(tagA).join(', '):'')+'</p>';
  html+='<h2>'+esc(n._title)+'</h2>';
  if(n.one_liner) html+='<p class="lead">'+prose(n.one_liner)+'</p>';
  var meta=[gradePill(n.evidence_grade,true),seenText(n)].filter(Boolean);
  if(meta.length) html+='<p class="meta">'+meta.join(dot)+'</p>';
  html+='<div class="entry-actions">'+Writer.pinButton(n.id)+'<a href="#/workbench" data-compare-cta data-compare-n'+(Writer.selected.length?'':' hidden')+'>Compare ('+Writer.selected.length+')</a><a href="#/graph/'+n.id+'">See it in the network</a></div>';

  if(prerequisite(n)){
    var inst=installLinks(n);
    html+='<p class="prereq"><b>Before you start:</b> this fires a trigger the listener already has. If they don’t have one yet, install it first'+
      (inst.length?' with '+inst.map(function(x){return '<a class="knav" href="#/entry/'+x.id+'">'+esc(x._title)+'</a>';}).join(' or '):'')+'.</p>';
  }
  var how=mechHTML(mechBody(n));
  if(n.steps&&n.steps.length){
    // Recipes: the steps are the usable line; the how-to and its variations fold under them.
    html+=sect('Steps','<ol class="steps">'+n.steps.map(function(s){
      var lv=s[0]!=null?S.byId[s[0]]:null;
      return '<li><p>'+prose(s[1])+'</p>'+(lv?'<a class="steplever knav" href="#/entry/'+lv.id+'">'+esc(lv._title)+'</a>':'')+'</li>';
    }).join('')+'</ol>'+(how?'<details class="more"><summary>More detail</summary>'+how+'</details>':''));
  } else if(how) html+=sect('How it’s done',how);

  if(n.why_short||n.principle_note){
    var g=GRADE[n.evidence_grade], w='';
    if(n.why_short) w+='<p class="body">'+prose(n.why_short)+'</p>';
    if(g) w+='<p class="grade"><b>'+g[0]+':</b> '+esc(g[1])+'</p>';
    if(n.finding_name) w+='<p class="finding">Related finding: '+(n.finding_url?'<a href="'+esc(n.finding_url)+'" target="_blank" rel="noopener noreferrer">'+esc(n.finding_name)+' ↗</a>':esc(n.finding_name))+'</p>';
    if(n.principle_note) w+='<details class="more"><summary>The longer explanation</summary><p class="body">'+prose(n.principle_note)+'</p></details>';
    html+=sect('Why it works',w);
  }

  html+=sect('Risk',riskBlock(n),'risk');

  if(n.ex&&n.ex.length){
    // One example on load, the Say-it line first; an example with no line goes last.
    var exl=n.ex.map(function(e,i){return [e,i];}).sort(function(a,b){return ((a[0].m?0:1)-(b[0].m?0:1))||(a[1]-b[1]);}).map(function(x){return x[0];});
    var exs=Writer.examples(n,exl.slice(0,1)), more=exl.length-1;
    if(more>0) exs+='<div class="exmore" id="exmore" hidden>'+Writer.examples(n,exl.slice(1))+'</div>'+
      '<button type="button" class="showall" id="exmoreBtn" aria-expanded="false" aria-controls="exmore">Show '+plural(more,'more example','more examples')+'</button>';
    html+=sect('Examples',exs,'ex');
  }
  if(n.examples_withheld) html+='<p class="metadata-evidence">Some examples are left out of this public edition because they stay too close to their source.</p>';

  // One mention per entry across the page: steps and install links above, then similar, the
  // recipes that use it, and look-alikes.
  var used=[], usedBy={}, above={};
  (S.usedIn[n.id]||[]).forEach(function(u){ if(usedBy[u.recipe]) usedBy[u.recipe].steps.push(u.step); else { usedBy[u.recipe]={r:S.byId[u.recipe],steps:[u.step],text:u.text}; used.push(usedBy[u.recipe]); } });
  (n.steps||[]).forEach(function(s){ if(s[0]!=null) above[s[0]]=1; });
  if(prerequisite(n)) installLinks(n).forEach(function(x){ above[x.id]=1; });
  used=used.filter(function(u){ return !above[u.r.id]; });
  used.forEach(function(u){ above[u.r.id]=1; });
  var cons=(S.contrasts[n.id]||[]).map(function(r){return S.byId[r.o];}).filter(function(o){return o&&!above[o.id]&&o.id!==n.id;});
  var sim=similarEntries(n,entryOnPage(n));
  if(sim.same.length||sim.heavier.length){
    var sb=sim.same.length?(sim.heavier.length?'<p class="sublab">Same job, other ways</p>':'')+'<ul class="simlist">'+sim.same.map(function(o){return simRow(o,n);}).join('')+'</ul>':'';
    if(sim.heavier.length) sb+='<details class="more heavier"><summary>Heavier variants ('+sim.heavier.length+')</summary><ul class="simlist">'+sim.heavier.map(function(o){return simRow(o,n);}).join('')+'</ul></details>';
    html+=sect('Similar entries',legendP()+sb,'similar');
  }
  if(used.length){
    var UCAP=5;
    html+=sect('Recipes that use this','<ul class="simlist" id="usedList">'+used.map(function(u,i){
      return simRow(u.r,n,'<span class="ssteps">'+(u.steps.length>1?'steps '+u.steps.join(', '):'step '+u.steps[0])+'</span>').replace('<li>',i>=UCAP&&used.length>UCAP+1?'<li hidden>':'<li>');}).join('')+'</ul>'+
      (used.length>UCAP+1?'<button type="button" class="showall" id="usedMore">Show all '+used.length+'</button>':''),'usedin');
  }
  if(cons.length) html+=sect('Easily confused with','<ul class="simlist">'+cons.map(function(o){return simRow(o,n);}).join('')+'</ul>','confused');
  html+='</article>';
  view.innerHTML=html;
  var mb=document.getElementById('exmoreBtn');
  if(mb) mb.addEventListener('click',function(){
    var box=document.getElementById('exmore'), open=box.hidden;
    box.hidden=!open; mb.setAttribute('aria-expanded',String(open));
    mb.textContent=open?'Show fewer examples':'Show '+plural(n.ex.length-1,'more example','more examples');
  });
  var um=document.getElementById('usedMore');
  if(um) um.addEventListener('click',function(){
    var hid=document.querySelectorAll('#usedList li[hidden]'); hid.forEach(function(li){ li.hidden=false; });
    um.remove(); var a=hid[0]&&hid[0].querySelector('a'); if(a) a.focus({preventScroll:true});
  });
}

                    easily confused below), laid out fresh per focus so labels never collide

var G=null; // map runtime (or ego resize hook), torn down on route change

var CARE_VAR={low:'--low',medium:'--warn',high:'--high'};

function bindGraphSearch(){

/* --- ego focus --- */
function egoSlots(n){
  var used={}; used[n.id]=1;
  function take(list,max){ var out=[]; list.forEach(function(x){ var o=S.byId[x[0]]; if(o&&!used[o.id]&&out.length<max){ used[o.id]=1; out.push({n:o,w:x[1]}); } }); return out; }
  // Before/after need 3+ uses (the corpus section's threshold); Similar is the entry page's
  // own list (same job, then heavier), so the panel and the page agree.
  var seq=function(list){ return (list||[]).filter(function(t){return t[1]>=3;}); };
  var sim=similarEntries(n,entryOnPage(n)), w={}; (n.nb||[]).forEach(function(p){ w[p[0]]=p[1]; });
  return {
    before:take(seq(S.prev[n.id]),4),
    after:take(seq(S.next[n.id]),4),
    similar:take(sim.same.concat(sim.heavier).map(function(o){return [o.id,w[o.id]||.55];}),5),
    confused:take((S.contrasts[n.id]||[]).map(function(r){return [r.o,1];}),4)

}
var measureCtx=null;

  var words=String(text).split(' '), lines=[], cur='';
  for(var i=0;i<words.length;i++){
    var t=cur?cur+' '+words[i]:words[i];
    if(measureCtx.measureText(t).width<=maxW||!cur){ cur=t; }
    else { lines.push(cur); cur=words[i]; }

    titles.push({t:title,x:Math.round(Math.max(pad,x0+sw0/2-Math.min(sw0-10,170)/2)),y:y+14,a:'start'}); y+=22;
    for(var row=0;row<rows;row++){

      var labs=items.map(function(it){ return wrapText(it.n._title,Math.min(sw-10,170),3); });
      var maxL=Math.max.apply(null,labs.map(function(l){return l.length;}));

        nodes.push({n:it.n,w:it.w,type:type,x:x,y:ny+arc,r:r,lines:labs[j],pos:labelAbove?'above':'below'});
      });
      y+=maxL*LH+2*r+20;
    }
  }
  function rowH(lines){ return Math.max(44,lines.length*LH+18); }
  function colH(col){ return col.reduce(function(s,c){return s+rowH(c.lines);},0); }
  function column(col,left,nx,top,mid){

    var colR=slots.after.map(function(it){return {it:it,lines:wrapText(it.n._title,labW,3)};});
    var fl=wrapText(n._title,Math.max(120,W-2*cw-40),2,FOCUS_FONT);
    var midH=Math.max(colH(colL),colH(colR),2*R+30+fl.length*18,100);

function egoEdges(L){

      points.set(e.pointerId,p);
      if(points.size>=2){ var q=pair(); if(pinch){ mapZoom(q.d/(pinch.d||q.d),pinch.x,pinch.y); G.tx+=q.x-pinch.x; G.ty+=q.y-pinch.y; } pinch=q; moved=true; }
      else if(last){ var dx=p.x-last.x, dy=p.y-last.y; if(Math.abs(dx)+Math.abs(dy)>3) moved=true; if(moved){ G.tx+=dx; G.ty+=dy; last=p; } }
      G.needsDraw=true;
    } else if(e.pointerType==='mouse'){ var hit=mapHit(p.x,p.y); if(hit!==G.hover){ G.hover=hit; G.needsDraw=true; canvas.style.cursor=hit?'pointer':'grab'; } }
  });
  function finish(e,cancelled){
    var p=point(e); points.delete(e.pointerId);
    if(!cancelled&&!moved){
      var hit=mapHit(p.x,p.y);
      // Touch: the first tap names a dot and shows its neighbours; a second tap opens it.
      if(hit&&(e.pointerType==='mouse'||hit===G.hover)) location.hash='#/graph/'+hit;
      else { G.hover=hit; G.needsDraw=true; }
    }
    pinch=null; last=points.size?Array.from(points.values())[0]:null; if(!points.size) canvas.classList.remove('dragging');
  }
  canvas.addEventListener('pointerup',function(e){ finish(e,false); });
  canvas.addEventListener('pointercancel',function(e){ finish(e,true); });
  canvas.addEventListener('pointerleave',function(e){ if(!points.size&&e.pointerType==='mouse'){ G.hover=null; G.needsDraw=true; } });
}
function mapLoop(){
  if(!G||G.dead) return;
  if(G.needsDraw){ var t0=performance.now(); mapDraw(); G.drawMs=performance.now()-t0; G.needsDraw=false; }
  G.raf=requestAnimationFrame(mapLoop);
}
function mapDraw(){
  var ctx=G.ctx;
  ctx.setTransform(G.dpr,0,0,G.dpr,0,0); ctx.clearRect(0,0,G.w,G.h);
  var ink1=G.ink1, ink3=G.ink3, surf=G.surf;
  var member=G.goal?function(n){return n.goals.indexOf(G.goal.id)>=0;}:null;
  var hov=G.hover&&S.byId[G.hover], hn={};
  if(hov){ hn[hov.id]=1; (hov.nb||[]).forEach(function(t){ hn[t[0]]=1; }); }
  // nb edges for the hovered dot only: the map itself draws no edges.
  if(hov){
    var a=toScreen(hov); ctx.strokeStyle=ink3; ctx.globalAlpha=.8;
    (hov.nb||[]).forEach(function(t){ var o=S.byId[t[0]], b=toScreen(o); ctx.lineWidth=Math.max(1,(t[1]-.5)*10); ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke(); });
  }
  // Three batches at most (dim, plain, lit), one path each: a frame stays well under 4 ms.
  // Plain dots are ink at .75 (3:1 against the surface); dimmed ones recede on purpose.
  var batches={d:{c:ink3,a:.16,list:[]},f:{c:ink3,a:.75,list:[]},l:{c:G.accent,a:1,list:[]}};
  // A phone-width canvas packs the same cloud into half the room: smaller dots keep it a cloud, not a blob.
  var ds=G.w<600?.7:1;
  S.nodes.forEach(function(n){
    var p=toScreen(n); if(p[0]<-8||p[0]>G.w+8||p[1]<-8||p[1]>G.h+8) return;
    var lit=member&&member(n), dim=(member&&!lit)||(hov&&!hn[n.id]);
    batches[dim?'d':lit?'l':'f'].list.push([p[0],p[1],(n.kind==='recipe'?5.2:3.4)*ds]);
  });
  G.litCount=batches.l.list.length;
  ['d','f','l'].forEach(function(k){
    var b=batches[k]; if(!b.list.length) return; ctx.globalAlpha=b.a; ctx.fillStyle=b.c; ctx.beginPath();
    b.list.forEach(function(q){ ctx.moveTo(q[0]+q[2],q[1]); ctx.arc(q[0],q[1],q[2],0,Math.PI*2); }); ctx.fill();
  });
  ctx.globalAlpha=1;
  // Labels: the hovered dot and its neighbours always; everything else only when zoomed in.
  var F=' 12px '+G.font;
  ctx.font=F; ctx.textBaseline='middle';
  var occupied=[], cands=[];
  if(hov){ cands.push(hov); (hov.nb||[]).forEach(function(t){ cands.push(S.byId[t[0]]); }); }
  if(G.k>=G.fitK*2.4) S.nodes.forEach(function(n){ if(!hn[n.id]&&(!member||member(n))) cands.push(n); });
  cands.forEach(function(n,i){
    var p=toScreen(n); if(p[0]<0||p[0]>G.w||p[1]<0||p[1]>G.h) return;
    ctx.font=(i===0&&hov?'650':'400')+F;
    var w=ctx.measureText(n._title).width+8, x=Math.min(p[0]+7,G.w-w-2), y=p[1]-9, h=18;
    if(occupied.some(function(o){return x<o.x+o.w&&x+w>o.x&&y<o.y+o.h&&y+h>o.y;})) return;
    occupied.push({x:x,y:y,w:w,h:h});
    // A surface-coloured halo, not a box: the label reads over dots without hiding them.
    ctx.lineJoin='round'; ctx.lineWidth=4; ctx.strokeStyle=surf; ctx.strokeText(n._title,x+4,y+9);
    ctx.fillStyle=ink1; ctx.fillText(n._title,x+4,y+9);
  });
  if(hov){ var hp=toScreen(hov); ctx.lineWidth=1.6; ctx.strokeStyle=ink1; ctx.beginPath(); ctx.arc(hp[0],hp[1],(hov.kind==='recipe'?5.2:3.4)+3,0,Math.PI*2); ctx.stroke(); }
}

/* ============ keyboard ============ */
document.addEventListener('keydown',function(e){
  if(!S.ready || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
  var tgt=e.target, inInput=tgt&&(tgt.tagName==='INPUT'||tgt.tagName==='TEXTAREA'||tgt.tagName==='SELECT'||tgt.isContentEditable);

  if(e.key==='/'&&!inInput){
    e.preventDefault();
    var q=document.getElementById('tableQuery')||document.getElementById('memberFilter')||document.getElementById('q')||document.getElementById('gsearch');
    if(q){ q.focus(); q.select(); }
    else{
      location.hash='#/';
      setTimeout(function(){ var qq=document.getElementById('q'); if(qq){ qq.focus(); qq.select(); } },0);
    }
    return;
  }

  if(e.key==='Escape'){
    if(inInput && !(tgt.tagName==='INPUT' && tgt.type==='search')) return;
    if(inInput){
      if(tgt.value){ tgt.value=''; tgt.dispatchEvent(new Event('input')); }
      else tgt.blur();
      return;
    }
    var open=document.querySelector('details.leaveout[open]'); if(open){ open.open=false; return; }
    var parts=parseHash().parts;
    if(parts[0]==='entry'){
      var node=S.byId[+parts[1]];
      if(node&&node.kind==='recipe') location.hash='#/recipes';
      else if(node&&node.stages.length) location.hash=tagHref(S.tagById[node.stages[0]]);
      else location.hash='#/';
    }
    else if(parts[0]==='graph'&&parts[1]) location.hash='#/graph';
    else if(parts[0]!=='') location.hash='#/';
    return;
  }

  if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowDown'){
    if(inInput || (tgt && ['BUTTON','SUMMARY','CANVAS'].includes(tgt.tagName))) return;
    var items=Array.prototype.slice.call(document.querySelectorAll('.knav'));
    if(!items.length) return;
    var cur=items.indexOf(document.activeElement);
    if(cur<0) return;
    var next=-1;
    if(e.key==='ArrowLeft')  next=cur-1;
    if(e.key==='ArrowRight') next=cur+1;
    if(e.key==='ArrowUp'||e.key==='ArrowDown'){
      next=nearestVertical(items,cur,e.key==='ArrowDown'?1:-1);
    }
    if(next>=0&&next<items.length){
      items[next].focus();
      items[next].scrollIntoView({block:'nearest'});
      e.preventDefault();
    }
  }
});

function nearestVertical(items,cur,dir){
  var me=items[cur].getBoundingClientRect();
  var myTop=me.top+window.scrollY, myX=me.left+me.width/2;
  var best=-1,bestDy=Infinity,bestDx=Infinity;
  for(var i=0;i<items.length;i++){
    if(i===cur) continue;
    var r=items[i].getBoundingClientRect();
    var top=r.top+window.scrollY;
    var dy=(top-myTop)*dir;
    if(dy<=2) continue;
    var dx=Math.abs(r.left+r.width/2-myX);
    if(dy<bestDy-2||(Math.abs(dy-bestDy)<=2&&dx<bestDx)){ best=i; bestDy=dy; bestDx=dx; }
  }
  return best;
}
